</style></head><body><header><div class="logo">⚾ 駿介 BASEBALL SUCCESS</div><div class="sub">THINK · CHALLENGE · GROW</div></header><div class="wrap"><nav id="nav"></nav><main id="view"></main><footer>自分で考え、自分で決め、自分で行動する。<br>昨日の自分を超えていこう。</footer></div><script>
'use strict';
const K='shunsuke_success_complete',OLD='shunsuke_success_v4',K3='shunsuke_success_v3_new';
const AB=['ミート','パワー','走力','肩力','守備力','捕球'],PB=['球威','制球力','スタミナ','投球術','投手守備','メンタル'];
const MENU=[['素振り','打撃','ミート',15,'回','バットの軌道とバランスを確認。量よりフォーム。'],['羽打ち','打撃','ミート',18,'回','芯で捉える感覚を確認。'],['置きティー','打撃','ミート',20,'回','軸足とミートポイントを意識。'],['フリーバッティング','打撃','パワー',20,'球','打球の質を振り返る。'],['シャドーピッチング','投手','投球術',20,'回','痛みがない場合のみ、フォーム確認。'],['キャッチボール','投手','制球力',20,'球','相手の胸を狙い、無理に強く投げない。'],['制球練習','投手','制球力',20,'球','目標を決めて精度を確認。'],['配球研究','投手','投球術',20,'分','打者と状況を考えて配球を説明。'],['投手フィールディング','投手','投手守備',20,'分','バント処理・ベースカバーを判断。'],['牽制の判断研究','投手','投球術',20,'分','状況を見て牽制の目的を考える。'],['ノック','守備','守備力',20,'分','一歩目と捕球姿勢を確認。'],['捕球練習','守備','捕球',15,'分','正面・逆シングルを丁寧に。'],['送球研究','守備','肩力',15,'分','足運びと送球判断を研究。'],['ラダートレーニング','走塁','走力',18,'分','正確な足運びを重視。'],['ベースランニング','走塁','走力',18,'分','走路と判断を確認。'],['走塁判断の研究','走塁','走力',18,'分','アウトカウント別の判断を考える。'],['ストレッチ','身体ケア','ケア',25,'分','痛みのない範囲で、医療者の指示に従う。'],['体幹・姿勢ケア','身体ケア','ケア',25,'分','腰の状態に応じ、許可された内容のみ。'],['野球ノート','自主学習','投球術',20,'分','今日の発見と次の課題を書く。'],['試合動画の研究','自主学習','投球術',20,'分','判断と動きの理由を考える。'],['睡眠・休養','身体ケア','ケア',16,'時間','回復を優先し、十分な睡眠を取ろう。']];
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(x,d=0)=>x===null||x===undefined||x===''?d:(Number.isFinite(Number(x))?Number(x):d);
const cap=(x,a=0,b=100)=>Math.min(b,Math.max(a,num(x)));
const arr=x=>Array.isArray(x)?x:[];
const get=id=>document.getElementById(id);
function fresh(){return {version:4,name:'駿介',hand:'右投右打',positions:['投手','一塁手','三塁手'],xp:0,energy:100,abilities:Object.fromEntries(AB.map(x=>[x,20])),pitch:Object.fromEntries(PB.map(x=>[x,20])),practice:[],games:[],growth:[],pitchlog:[],plans:[],reflections:[],week:Array(7).fill('休養'),goal:'',father:'自分で考え、自分で挑戦しよう！',pain:false,missionClaims:[],created:today()}}
function normalize(o){let d=fresh();if(!o||typeof o!=='object')return d;Object.assign(d,o);for(let k of ['practice','games','growth','pitchlog','plans','reflections','missionClaims'])d[k]=arr(d[k]);d.abilities={...fresh().abilities,...(o.abilities||{})};d.pitch={...fresh().pitch,...(o.pitch||{})};d.positions=arr(d.positions).slice(0,3);d.week=Array.isArray(d.week)?Array.from({length:7},(_,i)=>String(d.week[i]||'休養')):fresh().week;d.version=4;return d}
function fromV3(o){let n=fresh();for(let k of ['xp','energy','abilities','practice','games','growth','week','goal','father'])if(o[k]!==undefined)n[k]=o[k];n.migrated=true;return normalize(n)}
function readJSON(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
let origin='new';function load(){let a=readJSON(K);if(a&&a.version===4){origin='complete';return normalize(a)}a=readJSON(OLD);if(a&&a.version===4){origin='v4';return normalize(a)}a=readJSON(K3);if(a&&a.version===3){origin='v3';return fromV3(a)}return fresh()}
let db=load();function save(){try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){alert('保存できません。端末の空き容量やブラウザ設定を確認してください。');return false}}
if(origin!=='complete' && origin!=='new'){try{const raw=localStorage.getItem(origin==='v4'?OLD:K3);if(raw&&!localStorage.getItem('shunsuke_before_migration_v1'))localStorage.setItem('shunsuke_before_migration_v1',raw)}catch(e){console.warn(e)}}
if(origin!=='new'&&origin!=='complete')save();const level=()=>Math.floor(Math.sqrt(Math.max(0,num(db.xp))/100))+1;function xpRate(){let l=level(),a=100*(l-1)**2,b=100*l*l;return cap((db.xp-a)/(b-a)*100)}
function latest(k){return [...arr(db.growth)].filter(x=>num(x[k],0)>0).sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]?.[k]??null}
const count=n=>db.practice.filter(x=>x.name===n).length;
function rank(v){v=cap(v);return v>=90?'S':v>=80?'A':v>=65?'B':v>=50?'C':v>=35?'D':'E'}
function stat(n,v){v=cap(v);return `<div class="stat"><div class="row"><span>${esc(n)}</span><span><span class="rank">${rank(v)}</span>${v}</span></div><div class="bar"><span style="width:${v}%"></span></div></div>`}
function box(t,body,dark=false){return `<section class="panel ${dark?'dark':''}"><h2>${t}</h2>${body}</section>`}
function avatar(){return `<div class="avatar"><svg viewBox="0 0 250 305" role="img" aria-label="オリジナルの右投げ野球少年。左手にグローブ、右手にボール"><defs><linearGradient id="cap" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#399df2"/><stop offset="1" stop-color="#07306e"/></linearGradient><linearGradient id="jersey" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b7d9ff"/></linearGradient></defs><circle cx="125" cy="150" r="115" fill="#61bfff" opacity=".12"/><ellipse cx="123" cy="287" rx="92" ry="12" fill="#001535" opacity=".4"/><path d="M95 224L83 268M154 224L170 268" stroke="#f5f7ff" stroke-width="34" stroke-linecap="round"/><path d="M58 277H105M149 277H193" stroke="#092e6a" stroke-width="16" stroke-linecap="round"/><path d="M161 176Q192 156 205 126" stroke="#f0bc94" stroke-width="24" stroke-linecap="round" fill="none"/><circle cx="209" cy="119" r="15" fill="#f0bc94"/><circle cx="215" cy="102" r="15" fill="white" stroke="#cdd8e8" stroke-width="2"/><path d="M207 92q9 10 0 20m16-20q-9 10 0 20" stroke="#d94850" stroke-width="2" fill="none"/><path d="M69 179Q45 175 39 152" stroke="#f0bc94" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M21 118Q5 141 22 161Q48 171 58 145L48 120Z" fill="#6c422a" stroke="#2e1d16" stroke-width="5"/><path d="M25 128L42 150" stroke="#bd865b" stroke-width="4"/><path d="M66 166Q117 142 164 166L177 235Q125 251 60 233Z" fill="url(#jersey)" stroke="#073b85" stroke-width="5"/><path d="M99 160L119 197L139 160" fill="none" stroke="#1567bc" stroke-width="10"/><text x="120" y="224" text-anchor="middle" font-size="30" font-weight="900" fill="#1556a4">S</text><ellipse cx="117" cy="111" rx="66" ry="70" fill="#f2c49c" stroke="#955c40" stroke-width="3"/><path d="M51 109Q43 47 117 41Q190 45 182 108L162 87L145 99L123 83L96 102L74 87Z" fill="#20212c"/><path d="M77 110L99 105M135 105L158 110" stroke="#1a253b" stroke-width="6" stroke-linecap="round"/><ellipse cx="91" cy="126" rx="8" ry="12" fill="#142441"/><ellipse cx="145" cy="126" rx="8" ry="12" fill="#142441"/><circle cx="94" cy="121" r="3" fill="white"/><circle cx="148" cy="121" r="3" fill="white"/><path d="M107 155Q118 149 130 154" fill="none" stroke="#874d46" stroke-width="3" stroke-linecap="round"/><path d="M49 88Q42 20 117 17Q188 17 187 90L164 84Q115 70 66 91Z" fill="url(#cap)" stroke="#052454" stroke-width="5"/><path d="M49 88Q117 72 190 90Q188 108 118 109Q46 108 49 88" fill="#0b3679" stroke="#061e4b" stroke-width="4"/><text x="118" y="66" text-anchor="middle" font-size="39" font-weight="900" fill="white">S</text><path d="M194 173L230 156M193 186L235 185" stroke="#ffd34b" stroke-width="5" stroke-linecap="round"/></svg></div>`}
function titles(){let a=[];if(db.practice.length)a.push('努力のルーキー');if(db.practice.length>=10)a.push('継続の達人');if(db.practice.length>=30)a.push('努力の鉄人');if(db.games.length)a.push('初陣の勇者');if(db.games.reduce((s,x)=>s+num(x.hits),0)>=10)a.push('ヒットメーカー');if(db.pitchlog.length)a.push('マウンドへの第一歩');if(db.pitchlog.length>=5)a.push('投手研究家');if(count('配球研究')>=5)a.push('野球脳○');if(db.reflections.length>=5)a.push('考える選手');if(db.practice.filter(x=>x.kind==='身体ケア').length>=5)a.push('回復の達人');if(level()>=10)a.push('未来の主役');return a}
const SKILLS=[['🎯 制球力○','ストライク率60%以上の投球記録3回',3,()=>db.pitchlog.filter(x=>num(x.pitches)>0&&num(x.strikes)/num(x.pitches)>=.6).length],['🧠 投球術○','配球研究5回',5,()=>count('配球研究')],['🧤 投手守備○','投手フィールディング5回',5,()=>count('投手フィールディング')],['🔥 マウンド経験○','投球記録5回',5,()=>db.pitchlog.length],['📖 研究熱心','野球ノート・配球研究10回',10,()=>count('野球ノート')+count('配球研究')],['💪 回復上手','身体ケア10回',10,()=>db.practice.filter(x=>x.kind==='身体ケア').length],['⭐ 自主性○','自主計画5回',5,()=>db.plans.length],['🏆 振り返り上手','振り返り10回',10,()=>db.reflections.length]];
function skillHTML(){return `<div class="cards">${SKILLS.map(([n,desc,target,fn])=>{let p=fn(),done=p>=target;return `<div class="card" style="opacity:${done?1:.75}"><b>${done?'🌟':'🔒'} ${n}</b><p>${desc}</p><div class="bar"><span style="width:${cap(p/target*100)}%"></span></div><small>${p}/${target} ${done?'獲得！':''}</small></div>`}).join('')}</div>`}
function playerCard(){let h=latest('height'),w=latest('weight');return `<div class="hero">${avatar()}<div class="heroInfo"><small>PLAYER PROFILE · PITCHER</small><h1>${esc(db.name)}</h1><span class="pill">Lv.${level()}</span><span class="pill">${esc(db.hand)}</span><p>${db.positions.map(esc).join(' / ')||'守備位置未設定'}</p><p>身長 ${h??'—'} cm<br>体重 ${w??'—'} kg</p><div class="bar"><span style="width:${xpRate()}%"></span></div><small>${num(db.xp)} XP</small></div></div>`}
function tile(n,v,u=''){return `<div class="tile">${n}<strong>${esc(v)}</strong>${u}</div>`}
function home(){let rec=db.practice.slice(-4).reverse().map(x=>`<div class="listitem">${esc(x.date)}　${esc(x.name)}　<b>+${num(x.xp)} XP</b></div>`).join('')||'まだ記録がありません。';return box('🌟 MY BASEBALL SUCCESS',playerCard(),true)+box('📊 選手データ',`<div class="grid">${tile('レベル',level())}${tile('練習記録',db.practice.length,'回')}${tile('投球記録',db.pitchlog.length,'回')}${tile('獲得称号',titles().length,'個')}${tile('身長',latest('height')??'—','cm')}${tile('体重',latest('weight')??'—','kg')}</div>`)+box('🎯 今日の自分への問い',`<p>${db.pain?'痛みがある日は運動を控え、主治医の指示を優先しよう。':'今日は何を伸ばしたい？ なぜその練習を選ぶ？ 休養や研究も大切な選択だ。'}</p><button class="btn full" onclick="go('plan')">自分で今日の計画を立てる</button>`)+box('⭐ 獲得した称号',titles().map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'まだありません')+box('📖 最近の練習',rec)+box('💬 お父さんからのメッセージ',`<p>${esc(db.father)}</p>`)}
function profile(){return box('⚾ 選手カード',playerCard(),true)+box('🔥 投手能力',PB.map(x=>stat(x,db.pitch[x])).join(''))+box('🏏 野手能力',AB.map(x=>stat(x,db.abilities[x])).join(''))+box('⭐ 特殊能力',skillHTML())+box('🏆 称号',titles().map(x=>`<span class="pill">${esc(x)}</span>`).join('')||'まだありません')+box('🎯 今の目標',`<p>${esc(db.goal||'設定から目標を入力しよう')}</p>`)}
function training(){let cats=[...new Set(MENU.map(x=>x[1]))];return box('💪 練習記録',`<div class="notice">記録のために練習を増やさないでください。痛みがある日は運動を中止し、主治医の指示を優先してください。</div><label>コンディション</label><select id="pain"><option value="no" ${!db.pain?'selected':''}>痛みなし</option><option value="yes" ${db.pain?'selected':''}>痛みあり</option></select><label>カテゴリー</label><select id="cat" onchange="fillMenu()">${cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><label>メニュー</label><select id="menu" onchange="unitLabel()"></select><label id="unitLabel">実施量</label><input id="amount" type="number" min="0" step="0.5" placeholder="実施した回数・球数・時間"><label>実施時間（分・任意）</label><input id="careMinutes" type="number" min="0" max="1440" step="1" placeholder="例：10"><label>今日意識したこと</label><textarea id="memo" placeholder="何を考え、何が分かった？"></textarea><button class="btn full" onclick="addPractice()">練習を記録する</button>`)+box('📚 練習メニュー',cats.map(c=>`<h3>${esc(c)}</h3><div class="cards">${MENU.filter(m=>m[1]===c).map(m=>`<div class="card"><b>${esc(m[0])}</b><p>${esc(m[5])}</p><span class="pill">${esc(m[2])}</span></div>`).join('')}</div>`).join(''))+box('📖 練習履歴',db.practice.slice(-30).reverse().map(x=>`<div class="listitem">${esc(x.date)}　<b>${esc(x.name)}</b> ${x.amount!=null?esc(x.amount)+' '+esc(x.unit):''} <b>+${num(x.xp)} XP</b><div class="muted">${esc(x.note||'')}</div></div>`).join('')||'まだありません')}
function fillMenu(){let cat=get('cat'),sel=get('menu');if(!cat||!sel)return;let previous=sel.value;let choices=MENU.filter(x=>x[1]===cat.value);sel.innerHTML=choices.map(x=>`<option value="${esc(x[0])}">${esc(x[0])}</option>`).join('');if(choices.some(x=>x[0]===previous))sel.value=previous;unitLabel()}

}

 const notes=db.baseballNotebook11.notes;
 const cats=['打撃','投球','捕球','送球','守備','カバー','走塁','メンタル','身体'];
 return box('📓 野球ノート',
 '<p>「昨日よりも今日、今日より明日！自分に勝つ！」</p>'+
 '<label>日付</label><input type="date" id="c2nd" value="'+today()+'">'+
 '<label>場面</label><select id="c2scene"><option>練習</option><option>試合</option><option>自主練習</option><option>休養日</option></select>'+
 '<label>カテゴリー</label><select id="c2cat">'+cats.map(c=>'<option>'+c+'</option>').join('')+'</select>'+
 '<label>目標</label><textarea id="c2goal"></textarea>'+
 '<label>気づいたこと・よかったこと</label><textarea id="c2good"></textarea>'+
 '<label>改善点・次に試すこと</label><textarea id="c2next"></textarea>'+
 '<button class="btn full" onclick="c2SaveNote()">ノートを保存</button>')+
 box('📚 ノート履歴',notes.map((n,i)=>({n,i})).reverse().map(({n,i})=>
 '<div class="listitem"><b>'+esc(n.date||'')+'　'+esc(n.category||'')+'</b>'+
 '<p>目標：'+esc(n.goal||'')+'</p><p>気づき：'+esc(n.good||'')+'</p><p>次：'+esc(n.next||'')+'</p>'+
 arr(n.additions).map(a=>'<p>📝 '+esc(a.date||'')+'：'+esc(a.text||'')+'</p>').join('')+
 arr(n.deepDives).map(d=>'<p>🔍 '+esc(d.date||'')+'：'+esc((d.answers||[]).join(' / '))+'</p>').join('')+
 '<button class="btn ghost" onclick="c2EditNote('+i+')">編集</button> '+
 '<button class="btn ghost" onclick="c2AddNote('+i+')">追記</button> '+
 '<button class="btn ghost" onclick="c2DeepNote('+i+')">深掘り</button> '+
 '<button class="btn ghost" onclick="c2DeleteNote('+i+')">削除</button></div>').join('')||'まだありません');
}
function c2SaveNote(){
 const n={date:get('c2nd').value||today(),scene:get('c2scene').value,category:get('c2cat').value,
 goal:get('c2goal').value.trim(),good:get('c2good').value.trim(),next:get('c2next').value.trim(),additions:[],deepDives:[]};
 if(!n.goal&&!n.good&&!n.next){alert('内容を入力してください');return;}
 db.baseballNotebook11.notes.push(n);if(save())render();
}
function c2EditNote(i){
 const n=db.baseballNotebook11.notes[i];if(!n)return;
 const goal=prompt('目標を編集',n.goal||'');if(goal===null)return;
 const good=prompt('気づき・よかったことを編集',n.good||'');if(good===null)return;
 const next=prompt('次に試すことを編集',n.next||'');if(next===null)return;
 Object.assign(n,{goal,good,next});if(save())render();
}
function c2AddNote(i){
 const n=db.baseballNotebook11.notes[i];if(!n)return;
 const t=prompt('追記する内容');if(!t?.trim())return;
 if(!Array.isArray(n.additions))n.additions=[];
 n.additions.push({date:today(),text:t.trim()});if(save())render();
}
function c2DeepNote(i){
 const n=db.baseballNotebook11.notes[i];if(!n)return;
 const qs=['何が起きた？','なぜそうなったと思う？','次は何を変える？'];
 const answers=[];
 for(const q of qs){const a=prompt(q);if(a===null)return;answers.push(a.trim());}
 if(!Array.isArray(n.deepDives))n.deepDives=[];
 n.deepDives.push({date:today(),category:n.category,questions:qs,answers});if(save())render();
}
function c2DeleteNote(i){
 if(!confirm('このノートを削除しますか？ この操作は取り消せません。'))return;
 db.baseballNotebook11.notes.splice(i,1);if(save())render();
}
TABS.splice(1,0,['c2Notebook','📓 野球ノート']);
const c2BaseHome=home;
home=function(){return c2CarePanel()+c2BaseHome();};

render();
</script></body></html>こ
