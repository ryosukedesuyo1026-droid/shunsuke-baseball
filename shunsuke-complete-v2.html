<script>
'use strict';

const K = 'shunsuke_success_complete';
const OLD = 'shunsuke_success_v4';

const AB = [

/*

const MENU = [

  ],
  [

  ],
  [
    'ストレッチ', '身体ケア', 'ケア', 25, '分',
    '痛みのない範囲で、身体を整える。'
  ],
  [

  ],
  [
    '野球ノート', '自主学習', '投球術', 20, '分',
    '今日の発見と次の課題を書く。'
  ],
  [
    '試合動画の研究', '自主学習', '投球術', 20, '分',
    '判断と動きの理由を考える。'
  ]
];

/* ---------- 共通処理 ---------- */

const today = () => {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');
};

const esc = x => String(x ?? '').replace(
  /[&<>"']/g,
  c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c])
);

const num = (x, d = 0) => {
  if (x === null || x === undefined || x === '') {
    return d;
  }

  const n = Number(x);
  return Number.isFinite(n) ? n : d;
};

const cap = (x, a = 0, b = 100) =>
  Math.min(b, Math.max(a, num(x)));

const arr = x => Array.isArray(x) ? x : [];

const get = id => document.getElementById(id);

/* ---------- 初期データ ---------- */

function fresh() {
  return {
    version: 4,

    name: '駿介',
    hand: '右投右打',

    positions: [
      '投手',
      '一塁手',
      '三塁手'
    ],

    xp: 0,
    energy: 100,

    abilities: Object.fromEntries(
      AB.map(x => [x, 20])
    ),

    pitch: Object.fromEntries(
      PB.map(x => [x, 20])
    ),

    practice: [],
    games: [],
    growth: [],
    pitchlog: [],
    plans: [],
    reflections: [],

    week: Array(7).fill('休養'),

    goal: '',
    father: '自分で考え、自分で挑戦しよう！',

    pain: false,
    missionClaims: [],

    baseballNotebook11: {
      notes: [],
      speeds: []
    },

    created: today()
  };
}

/* ---------- 既存データの補正 ---------- */

function normalize(o) {
  const d = fresh();

  if (!o || typeof o !== 'object') {
    return d;
  }

  Object.assign(d, o);

  const arrays = [
    'practice',
    'games',
    'growth',
    'pitchlog',
    'plans',
    'reflections',
    'missionClaims'
  ];

  for (const k of arrays) {
    d[k] = arr(d[k]);
  }

  d.abilities = {
    ...fresh().abilities,
    ...(o.abilities || {})
  };

  d.pitch = {
    ...fresh().pitch,
    ...(o.pitch || {})
  };

  d.positions = arr(d.positions).slice(0, 3);

  d.week = Array.isArray(d.week)
    ? Array.from(
        { length: 7 },
        (_, i) => String(d.week[i] || '休養')
      )
    : fresh().week;

  if (
    !d.baseballNotebook11 ||
    typeof d.baseballNotebook11 !== 'object'
  ) {
    d.baseballNotebook11 = {
      notes: [],
      speeds: []
    };
  }

  d.baseballNotebook11.notes =
    arr(d.baseballNotebook11.notes);

  d.baseballNotebook11.speeds =
    arr(d.baseballNotebook11.speeds);

  d.version = 4;

  return d;
}

/* ---------- 旧バージョンからの移行 ---------- */

function fromV3(o) {
  const n = fresh();

  for (const k of [
    'xp',
    'energy',
    'abilities',
    'practice',
    'games',
    'growth',
    'week',
    'goal',
    'father'
  ]) {
    if (o[k] !== undefined) {
      n[k] = o[k];
    }
  }

  n.migrated = true;
  return normalize(n);
}

function readJSON(k) {
  try {
    return JSON.parse(localStorage.getItem(k));
  } catch {
    return null;
  }
}

let origin = 'new';

function load() {
  let a = readJSON(K);

  if (a && typeof a === 'object' && a.version === 4) {
    origin = 'complete';
    return normalize(a);
  }

  a = readJSON(OLD);

  if (a && typeof a === 'object' && a.version === 4) {
    origin = 'v4';
    return normalize(a);
  }

  a = readJSON(K3);

  if (a && typeof a === 'object' && a.version === 3) {
    origin = 'v3';
    return fromV3(a);
  }

  return fresh();
}

let db = load();

function save() {
  try {
    localStorage.setItem(K, JSON.stringify(db));
    return true;
  } catch (e) {
    alert(
      '保存できません。端末の空き容量やブラウザ設定を確認してください。'
    );
    return false;
  }
}

/*
 注意：
 起動時には自動保存しない。
 データの書き込みは記録操作の際に行う。
*/

/* ---------- レベル・経験値 ---------- */

const level = () =>
  Math.floor(
    Math.sqrt(Math.max(0, num(db.xp)) / 100)
  ) + 1;

function xpRate() {
  const l = level();
  const a = 100 * (l - 1) ** 2;
  const b = 100 * l ** 2;

  return cap(
    (db.xp - a) / (b - a) * 100
  );
}

function latest(k) {
  return [...arr(db.growth)]
    .filter(x => num(x[k], 0) > 0)
    .sort(
      (a, b) =>
        String(b.date).localeCompare(String(a.date))
    )[0]?.[k] ?? null;
}

const count = n =>
  db.practice.filter(x => x.name === n).length;

function rank(v) {
  v = cap(v);

  if (v >= 90) return 'S';
  if (v >= 80) return 'A';
  if (v >= 65) return 'B';
  if (v >= 50) return 'C';
  if (v >= 35) return 'D';

  return 'E';
}

/* ---------- 身体ケアの時間集計 ---------- */

function careMinutes(x) {
  if (!x) return 0;

  const isCare =
    x.kind === '身体ケア' ||
    x.category === '身体ケア';

  if (!isCare) return 0;

  if (/睡眠|休養/.test(x.name || '')) {
    return 0;
  }

  const direct = num(x.minutes);

  if (direct > 0) {
    return Math.min(direct, 1440);
  }

  if (x.unit === '分') {
    return Math.min(
      Math.max(0, num(x.amount)),
      1440
    );
  }

  return 0;
}

function careTotal(start, end) {
  const quick = arr(db.success2027?.quick);

  const records = [
    ...db.practice,
    ...quick
  ].filter(
    x => x.date >= start && x.date <= end
  );

  return records.reduce(
    (sum, x) => sum + careMinutes(x),
    0
  );
}

function minutesText(minutes) {
  const m = Math.max(0, Math.round(num(minutes)));

  const hours = Math.floor(m / 60);
  const rest = m % 60;

  if (!hours) return `${rest}分`;
  if (!rest) return `${hours}時間`;

  return `${hours}時間${rest}分`;
}

/* ---------- 週の開始日 ---------- */

function weekStart() {
  const d = new Date();
  const day = (d.getDay() + 6) % 7;

  d.setDate(d.getDate() - day);

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');
}

function weekEnd() {
  const d = new Date(weekStart() + 'T12:00:00');

  d.setDate(d.getDate() + 6);

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');
}

/* ---------- 週間身体ケア評価 ---------- */

function weeklyCareStats() {
  const start = weekStart();
  const end = weekEnd();

  const records = [
    ...db.practice,
    ...arr(db.success2027?.quick)
  ].filter(
    x =>
      x.date >= start &&
      x.date <= end &&
      careMinutes(x) > 0
  );

  return {
    minutes: records.reduce(
      (sum, x) => sum + careMinutes(x),
      0
    ),

    days: new Set(
      records.map(x => x.date)
    ).size,

    count: records.length
  };
}

/*
 第3回：

/* =========================================
   COMPLETE 2.0
   第3回：画面部品・選手情報・ホーム
========================================= */

/* ---------- 画面の共通部品 ---------- */

function box(title, content, dark = false) {
  return `
    <section class="panel ${dark ? 'dark' : ''}">
      <h2>${title}</h2>
      ${content}
    </section>
  `;
}

function tile(label, value, unit = '') {
  return `
    <div class="tile">
      <span>${esc(label)}</span>
      <strong>${esc(value)}</strong>
      <small>${esc(unit)}</small>
    </div>
  `;
}

function progress(value, max = 100) {
  const percentage = max > 0
    ? cap(num(value) / max * 100)
    : 0;

  return `
    <div class="bar">
      <span style="width:${percentage}%"></span>
    </div>
  `;
}

function abilityCard(name, value) {
  const v = cap(value);

  return `
    <div class="stat">
      <div class="row">
        <span>${esc(name)}</span>
        <span>
          <span class="rank">${rank(v)}</span>
          ${Math.round(v)}
        </span>
      </div>
      ${progress(v)}
    </div>
  `;
}

/* ---------- 選手称号 ---------- */

function playerTitle() {
  const l = level();

  if (l >= 30) return '伝説への挑戦者';
  if (l >= 25) return '全国を目指す挑戦者';
  if (l >= 20) return '努力のエース';
  if (l >= 15) return '成長する主力選手';
  if (l >= 10) return '未来のエース';
  if (l >= 5) return '努力を続ける野球少年';

  return '夢に向かう挑戦者';
}

function specialAbilities() {
  const result = [];

  const practices = arr(db.practice);
  const games = arr(db.games);
  const care = practices.filter(
    x => careMinutes(x) > 0
  );

  if (practices.length >= 10) {
    result.push('継続力○');
  }

  if (practices.length >= 30) {
    result.push('努力家');
  }

  if (practices.length >= 100) {
    result.push('練習の達人');
  }

  if (games.length >= 5) {
    result.push('試合経験○');

/* ---------- 練習の分類 ---------- */

const TRAINING_CATEGORIES = [
  '打撃',
  '投手',
  '守備',
  '走塁',
  '身体ケア',
  '自主学習'
];

function trainingCategory(x) {
  if (!x) return 'その他';

  if (x.kind && TRAINING_CATEGORIES.includes(x.kind)) {
    return x.kind;
  }

  if (
    x.category &&
    TRAINING_CATEGORIES.includes(x.category)
  ) {
    return x.category;
  }

  const menu = MENU.find(m => m[0] === x.name);

  return menu ? menu[1] : 'その他';
}

function isCareTraining(x) {
  return trainingCategory(x) === '身体ケア' &&
    !/睡眠|休養/.test(x.name || '');
}

function isStudyTraining(x) {
  return trainingCategory(x) === '自主学習';
}

function isPhysicalTraining(x) {
  return !isCareTraining(x) &&
    !isStudyTraining(x) &&
    !/睡眠|休養/.test(x.name || '');
}

/* ---------- 練習時間 ---------- */

function trainingMinutes(x) {
  if (!x) return 0;

  const m = num(x.minutes);

  if (m > 0) {
    return Math.min(1440, m);
  }

  if (x.unit === '分') {
    return Math.min(
      1440,
      Math.max(0, num(x.amount))
    );
  }

  return 0;
}

/*
 身体ケア：
 ストレッチ10分 → 身体ケア10分

 身体ケアは身体ケアの時間として評価。
 通常練習時間には二重加算しない。
*/

/* ---------- 週間の練習集計 ---------- */

function weeklyTrainingStats() {
  const start = weekStart();
  const end = weekEnd();

  const rows = [
    ...arr(db.practice),
    ...arr(db.success2027?.quick)
  ].filter(
    x => x.date >= start && x.date <= end
  );

  const physical = rows.filter(isPhysicalTraining);
  const care = rows.filter(isCareTraining);
  const study = rows.filter(isStudyTraining);

  return {
    physicalMinutes: physical.reduce(
      (s, x) => s + trainingMinutes(x),
      0
    ),

    careMinutes: care.reduce(
      (s, x) => s + trainingMinutes(x),
      0
    ),

    studyMinutes: study.reduce(
      (s, x) => s + trainingMinutes(x),
      0
    ),

    physicalDays: new Set(
      physical.map(x => x.date)
    ).size,

    careDays: new Set(
      care.map(x => x.date)
    ).size,

    practiceCount: physical.length,

    careCount: care.length
  };
}

/* ---------- XP計算 ---------- */

function trainingXP(menu, amount, minutes) {
  const base = num(menu[3], 10);
  const category = menu[1];

  let xp = base;

  if (category === '身体ケア') {
    /*
      短時間のケアも評価する。
      時間を増やしてXPを稼ぐ仕組みにはしない。
    */

    if (minutes >= 1) {
      xp += 5;
    }

    if (minutes >= 5) {
      xp += 5;
    }

    if (minutes >= 10) {
      xp += 5;
    }

    return Math.min(40, xp);
  }

  if (category === '自主学習') {
    return Math.min(35, base + 5);
  }

  if (amount > 0) {
    xp += Math.min(10, Math.floor(amount / 20));
  }

  return Math.min(40, xp);
}

/* ---------- 能力値の成長 ---------- */

function addTrainingAbility(menu, xp) {
  const ability = menu[2];

  /*
    身体ケアはXPで評価するが、
    無理に身体能力を上昇させない。
  */

  if (
    menu[1] === '身体ケア' ||
    menu[1] === '自主学習'
  ) {
    return;
  }

  const gain = Math.max(1, Math.floor(xp / 20));

  if (Object.hasOwn(db.abilities, ability)) {
    db.abilities[ability] = cap(
      num(db.abilities[ability]) + gain
    );
  }

  if (Object.hasOwn(db.pitch, ability)) {
    db.pitch[ability] = cap(
      num(db.pitch[ability]) + gain
    );
  }
}

    return;

  const xp = trainingXP(
    menu,
    amount,
    minutes
  );

  const record = {

    name: menu[0],
    kind: menu[1],
    category: menu[1],
    ability: menu[2],
    amount,
    unit,
    minutes,
    note,
    xp,
    createdAt: new Date().toISOString()
  };

  db.practice.push(record);
  db.xp = num(db.xp) + xp;

  addTrainingAbility(menu, xp);

  if (save()) {
    alert(
      `${menu[0]}を記録しました！\n` +
      `獲得XP：${xp}`

    render();

function deletePractice(index) {
  if (
    !Number.isInteger(index) ||
    index < 0 ||
    index >= db.practice.length
  ) {
    return;
  }

  const record = db.practice[index];

  const ok = confirm(
    `${record.name}の記録を削除しますか？`
  );

  if (!ok) return;

  /*
    XPや能力値は他の記録と関連する可能性があるため、
    ここでは自動減算しない。
    削除時に経験値が不正に変動することを防ぐ。

  db.practice.splice(index, 1);

  if (save()) {
    render();
  }
}

/* ---------- 試合成績の集計 ---------- */

function gameStats() {
  const games = arr(db.games);

  const sum = key => games.reduce(
    (total, g) => total + Math.max(0, num(g[key])),
    0
  );

  const atBats = sum('atBats');
  const hits = sum('hits');
  const walks = sum('walks');
  const hbp = sum('hbp');
  const sacFlies = sum('sacFlies');

  const avg = atBats > 0
    ? hits / atBats
    : null;

  const obpDenominator =
    atBats + walks + hbp + sacFlies;

  const obp = obpDenominator > 0
    ? (hits + walks + hbp) / obpDenominator
    : null;

  return {
    games: games.length,
    atBats,
    hits,
    homeRuns: sum('homeRuns'),
    rbi: sum('rbi'),
    walks,
    strikeouts: sum('strikeouts'),
    steals: sum('steals'),
    avg,
    obp
  };
}

function baseballAverage(value) {
  return value === null
    ? '---'
    : value.toFixed(3).replace(/^0/, '');
}

function deleteGame(index) {
  if (
    !Number.isInteger(index) ||
    index < 0 ||
    index >= db.games.length
  ) return;

  if (!confirm('この試合記録を削除しますか？')) {
    return;
  }

  db.games.splice(index, 1);

  if (save()) render();
}

/* ---------- 投手成績 ---------- */

function pitchingStats() {
  const logs = arr(db.pitchlog);

  const total = key => logs.reduce(
    (sum, x) => sum + Math.max(0, num(x[key])),
    0
  );

  const outs = total('outs');
  const earnedRuns = total('earnedRuns');

  return {
    appearances: logs.length,
    outs,
    innings: Math.floor(outs / 3),
    remainingOuts: outs % 3,
    pitches: total('pitches'),
    strikeouts: total('strikeouts'),
    walks: total('walks'),
    earnedRuns,
    era: outs > 0
      ? earnedRuns * 21 / outs
      : null
  };
}

/* ---------- ノート新規保存 ---------- */

function saveNotebook() {
  const value = id =>
    get(id)?.value.trim() || '';

  const record = {
    date: value('noteDate') || today(),
    scene: value('noteScene'),
    place: value('notePlace'),
    weather: value('noteWeather'),
    condition: value('noteCondition'),
    category: value('noteCategory'),
    goal: value('noteGoal'),
    content: value('noteContent'),
    rating: value('noteRating'),
    focus: value('noteFocus'),
    result: value('noteResult'),
    good: value('noteGood'),
    improve: value('noteImprove'),
    next: value('noteNext'),
    additions: [],
    deepDives: [],
    createdAt: new Date().toISOString()
  };

  if (
    !record.goal &&
    !record.content &&
    !record.good &&
    !record.next
  ) {
    alert('ノートの内容を入力してください。');
    return;
  }

  noteRecords().push(record);

  if (save()) {
    alert('野球ノートを保存しました！');
    render();
  }
}

/* ---------- ノート編集 ---------- */

function editNotebook(index) {
  const n = noteRecords()[index];

  if (!n) return;

  const fields = [
    ['goal', '今日の目標'],
    ['content', '練習・試合の内容'],
    ['focus', '意識したこと'],
    ['result', '結果'],
    ['good', 'よかったこと'],
    ['improve', '改善点'],
    ['next', '次に挑戦すること']
  ];

  const changes = {};

  for (const [key, label] of fields) {
    const answer = prompt(
      label,
      n[key] || ''
    );

    if (answer === null) {
      return;
    }

    changes[key] = answer.trim();
  }

  Object.assign(n, changes);

  if (save()) {
    render();
  }
}

/* ---------- ノート追記 ---------- */

function appendNotebook(index) {
  const n = noteRecords()[index];

  if (!n) return;

  const text = prompt(
    'このノートに追記する内容を入力してください。'
  );

  if (!text || !text.trim()) {
    return;
  }

  if (!Array.isArray(n.additions)) {
    n.additions = [];
  }

  n.additions.push({
    date: today(),
    text: text.trim()
  });

  if (save()) {
    render();
  }
}

/* ---------- ノート削除 ---------- */

function deleteNotebook(index) {
  const notes = noteRecords();

  if (!notes[index]) return;

  if (!confirm(
    'この野球ノートを削除しますか？\n' +
    '削除した記録は元に戻せません。'
  )) {
    return;
  }

  notes.splice(index, 1);

  if (save()) {
    render();
  }
}

/* ---------- ノートのコピー ---------- */

function notebookText(n) {
  const lines = [
    '⚾ 駿介 野球ノート',
    `日付：${n.date || ''}`,
    `場面：${n.scene || ''}`,
    `カテゴリー：${n.category || ''}`,
    `目標：${n.goal || ''}`,
    `内容：${n.content || ''}`,
    `自己評価：${n.rating || ''}`,
    `意識したこと：${n.focus || ''}`,
    `結果：${n.result || ''}`,
    `よかったこと：${n.good || ''}`,
    `改善点：${n.improve || ''}`,
    `次の挑戦：${n.next || ''}`
  ];

  arr(n.additions).forEach(a => {
    lines.push(
      `追記（${a.date || ''}）：${a.text || ''}`
    );
  });

  arr(n.deepDives).forEach(d => {
    lines.push(
      `深掘り（${d.date || ''}）`
    );

    arr(d.questions).forEach((q, i) => {
      lines.push(
        `${q}：${arr(d.answers)[i] || ''}`
      );
    });
  });

  return lines.join('\n');
}

async function copyNotebook(index) {
  const n = noteRecords()[index];

  if (!n) return;

  const text = notebookText(n);

  try {
    await navigator.clipboard.writeText(text);
    alert('ノートをコピーしました！');
  } catch {
    prompt(
      '以下を長押ししてコピーしてください。',
      text
    );
  }
}

/* ---------- 深掘り質問の状態 ---------- */

let deepDiveState = null;

function startDeepDive(index) {
  const n = noteRecords()[index];

  if (!n) return;

  deepDiveState = {
    index,
    category: n.category || 'メンタル',
    step: 0,
    answers: [],
    freeAnswers: []
  };

  showDeepDive();
}

/* ---------- 深掘り画面 ---------- */

function showDeepDive() {
  if (!deepDiveState) return;

  const state = deepDiveState;

  const questions = noteQuestions(
    state.category
  );

  const q = questions[state.step];

  if (!q) return;

  let overlay = get('deepDiveOverlay');

  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'deepDiveOverlay';

    overlay.style.cssText = `
      position:fixed;
      inset:0;
      z-index:9999;
      background:rgba(0,10,30,.82);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:15px;
    `;

    document.body.appendChild(overlay);
  }

  overlay.innerHTML = `
    <div style="
      background:white;
      color:#14274b;
      border-radius:18px;
      padding:18px;
      width:100%;
      max-width:520px;
      max-height:90vh;
      overflow:auto;
    ">
      <h2>
        🔍 深掘り
        ${state.step + 1} / ${questions.length}
      </h2>

      <h3>${esc(q.question)}</h3>

      ${q.options.map((option, i) => `
        <label class="choice"
          style="
            border:1px solid #cbdcf0;
            padding:10px;
            border-radius:9px;
            margin-bottom:7px;
          ">
          <input
            type="radio"
            name="deepAnswer"
            value="${i}"
            ${
              state.answers[state.step] === option
                ? 'checked'
                : ''
            }
          >
          ${esc(option)}
        </label>
      `).join('')}

      <label>自分の言葉で詳しく書く（任意）</label>

      <textarea id="deepFree"
        placeholder="なぜそう思った？"
      >${esc(
        state.freeAnswers[state.step] || ''
      )}</textarea>

      <div style="
        display:flex;
        gap:8px;
        margin-top:12px;
      ">
        <button class="btn ghost"
          onclick="closeDeepDive()">
          中止
        </button>

        ${
          state.step > 0
            ? `
              <button class="btn ghost"
                onclick="previousDeepDive()">
                戻る
              </button>
            `
            : ''
        }

        <button class="btn blue"
          onclick="nextDeepDive()">
          ${
            state.step === questions.length - 1
              ? '保存'
              : '次へ'
          }
        </button>
      </div>
    </div>
  `;
}

/* ---------- 回答の取得 ---------- */

function captureDeepAnswer() {
  if (!deepDiveState) return false;

  const selected = document.querySelector(
    'input[name="deepAnswer"]:checked'
  );

  if (!selected) {
    alert('選択肢を一つ選んでください。');
    return false;
  }

  const state = deepDiveState;

  const q = noteQuestions(
    state.category
  )[state.step];

  state.answers[state.step] =
    q.options[Number(selected.value)];

  state.freeAnswers[state.step] =
    get('deepFree')?.value.trim() || '';

  return true;
}

/* ---------- 次の質問 ---------- */

function nextDeepDive() {
  if (!deepDiveState) return;

  if (!captureDeepAnswer()) {
    return;
  }

  const state = deepDiveState;

  const questions = noteQuestions(
    state.category
  );

  if (state.step < questions.length - 1) {
    state.step++;
    showDeepDive();
    return;
  }

  saveDeepDive();
}

/* ---------- 前の質問 ---------- */

function previousDeepDive() {
  if (!deepDiveState) return;

  if (deepDiveState.step > 0) {
    deepDiveState.step--;
    showDeepDive();
  }
}

/* ---------- 深掘り保存 ---------- */

function saveDeepDive() {
  if (!deepDiveState) return;

  const state = deepDiveState;
  const n = noteRecords()[state.index];

  if (!n) {
    closeDeepDive();
    return;
  }

  const questions = noteQuestions(
    state.category
  );

  const answers = questions.map((q, i) => {
    const selected = state.answers[i] || '';
    const free = state.freeAnswers[i] || '';

    return free
      ? `${selected}／${free}`
      : selected;
  });

  if (!Array.isArray(n.deepDives)) {
    n.deepDives = [];
  }

  n.deepDives.push({
    date: today(),
    category: state.category,
    questions: questions.map(q => q.question),
    answers
  });

  if (save()) {
    closeDeepDive();
    render();
  }
}

/* ---------- 深掘り画面を閉じる ---------- */

function closeDeepDive() {
  get('deepDiveOverlay')?.remove();
  deepDiveState = null;
}

  );

/* ---------- バックアップの復元 ---------- */

function importData() {
  const file = get('importFile')?.files?.[0];

  if (!file) {
    alert('バックアップファイルを選択してください。');
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);

      if (
        parsed.app !==
        'SHUNSUKE_BASEBALL_SUCCESS'
      ) {
        throw new Error('形式が異なります');
      }

      if (
        !parsed.data ||
        typeof parsed.data !== 'object'
      ) {
        throw new Error('データがありません');
      }

      const ok = confirm(
        'バックアップを復元しますか？\n' +
        '現在の統合版データが置き換わります。'
      );

      if (!ok) return;

      const restored = normalize(parsed.data);
      const previous = db;

      db = restored;

      if (!save()) {
        db = previous;
        return;
      }

      alert('データを復元しました！');
      render();

    } catch {
      alert(
        'バックアップを読み込めませんでした。'
      );
    }
  };

  reader.readAsText(file);
}

        <select id="settingsHand">
          ${[
            '右投右打',
            '右投左打',
            '左投左打',
            '左投右打'
          ].map(x => `
            <option
              ${db.hand === x ? 'selected' : ''}>
              ${x}
            </option>
          `).join('')}
        </select>

        <label>お父さんからのメッセージ</label>
        <textarea id="settingsFather"
        >${esc(db.father || '')}</textarea>

        <button class="btn full"
          onclick="saveSettings()">
          設定を保存
        </button>
      `
    )}

    ${box(
      '🛡️ データの保護',
      `
        <p>
          大切な記録を守るため、
          定期的にバックアップを作成してください。
        </p>

        <button class="btn blue full"
          onclick="exportData()">
          バックアップを書き出す
        </button>

        <h3>バックアップから復元</h3>

        <input
          type="file"
          id="importFile"
          accept=".json,application/json"
        >

        <button class="btn ghost full"
          onclick="importData()">
          バックアップを読み込む
        </button>

        <div class="notice">
          このアプリの記録は、
          基本的に使用端末のブラウザ内に保存されます。
          GitHubに公開しただけでは、
          iPhoneとiPadの記録は自動共有されません。
        </div>
      `
    )}
  `;
}

function saveSettings() {
  db.name =
    get('settingsName')?.value.trim() ||
    '駿介';

  db.hand =
    get('settingsHand')?.value ||
    '右投右打';

  db.father =
    get('settingsFather')?.value.trim() || '';

  if (save()) {
    render();
  }
}

/* ---------- 画面一覧 ---------- */

const TABS = [
  ['home', '🏠 ホーム'],
  ['profile', '👤 選手'],
  ['training', '⚾ 練習'],
  ['notebook', '📓 野球ノート'],
  ['game', '🏆 試合'],
  ['pitching', '🔥 投手'],
  ['speed', '🚀 球速'],
  ['growth', '📏 成長'],
  ['plan', '📅 週間予定'],
  ['reflection', '🧠 振り返り'],
  ['settings', '⚙️ 設定']
];

const SCREENS = {
  home,
  profile,
  training,
  notebook,
  game,
  pitching: pitchingScreen,
  speed: speedScreen,
  growth,
  plan,
  reflection,
  settings
};

/* ---------- 画面切り替え ---------- */

let tab = 'home';

function go(next) {
  if (!SCREENS[next]) {
    next = 'home';
  }

  tab = next;
  render();

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

/* ---------- 画面描画 ---------- */

function render() {
  const nav = get('nav');
  const view = get('view');

  if (!nav || !view) {
    return;
  }

  nav.innerHTML = TABS.map(
    ([id, label]) => `
      <button
        class="${tab === id ? 'active' : ''}"
        onclick="go('${id}')"
      >
        ${label}
      </button>
    `
  ).join('');

  const screen = SCREENS[tab] || home;

  view.innerHTML = screen();

  if (tab === 'training') {
    updatePracticeFields();
  }
}

/* ---------- アプリ起動 ---------- */

render();
</script>
</body>
</html>
