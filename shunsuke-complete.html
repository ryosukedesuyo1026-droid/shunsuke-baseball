
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092e62">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>駿介の野球サクセス COMPLETE</title>
<style>
:root{
  --navy:#082954;
  --blue:#1764b6;
  --sky:#d9efff;
  --gold:#ffd44e;
  --ink:#153354;
  --border:#9dbfdf;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN",sans-serif;
  background:linear-gradient(#0a366a,#83c4ee);
  color:var(--ink);
  min-height:100vh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{
  background:linear-gradient(120deg,#071e42,#15549b);
  color:white;
  padding:13px;
  border-bottom:4px solid var(--gold);
}
.logo{
  color:var(--gold);
  font-size:clamp(19px,4vw,29px);
  font-weight:900;
}
.subtitle{font-size:10px;letter-spacing:2px}
.wrap{max-width:1100px;margin:auto;padding:10px 10px 90px}
nav{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:9px 0;
  position:sticky;
  top:0;
  z-index:10;
  background:#0b376d;
}
nav button{
  white-space:nowrap;
  border:1px solid #6ea7df;
  border-radius:22px;
  background:#174d8a;
  color:white;
  padding:10px 12px;
  font-size:12px;
  font-weight:800;
}
nav button.active{
  background:linear-gradient(#ffe994,#ffc631);
  color:#16345a;
}
.panel{
  background:linear-gradient(#fff,#edf7ff);
  border:2px solid var(--border);
  border-radius:14px;
  padding:13px;
  margin:10px 0;
  box-shadow:0 4px 0 #15416e;
}
.panel h2{
  margin:0 0 12px;
  padding:7px 10px;
  border-radius:8px;
  background:linear-gradient(90deg,#0753a5,#75baf0);
  color:white;
  font-size:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.tile,.card{
  background:#eaf5ff;
  border:1px solid #bbd6f0;
  border-radius:10px;
  padding:11px;
  min-width:0;
}
.tile strong{
  display:block;
  font-size:23px;
  color:#1255a3;
}
.card b{display:block}
.card p{font-size:12px;color:#516b86}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:9px;
}
.btn{
  background:linear-gradient(#ffe885,#ffbb2d);
  color:#17375a;
  border:1px solid #d99b15;
  border-radius:10px;
  padding:12px;
  font-weight:900;
}
.btn.blue{
  background:linear-gradient(#65bbff,#1260ba);
  color:white;
  border-color:#0a4b99;
}
.btn.ghost{background:#e4effa;color:#174b82}
.full{width:100%}
input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #aac7e4;
  border-radius:9px;
  background:white;
  color:#173354;
  margin:5px 0 11px;
}
textarea{min-height:75px}
label{display:block;font-size:13px;font-weight:700}
.bar{
  height:10px;
  background:#cddff0;
  border-radius:20px;
  overflow:hidden;
  margin:6px 0;
}
.bar span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#279aff,#ffd34c);
}
.pill{
  display:inline-block;
  background:linear-gradient(#ffe994,#f5bc35);
  color:#263b55;
  border-radius:20px;
  padding:5px 10px;
  font-size:12px;
  font-weight:900;
  margin:3px;
}
.hero{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:230px;
  background:linear-gradient(120deg,#0754a2,#9bd6fa);
  border-radius:12px;
  padding:10px;
  overflow:hidden;
}
.avatar{width:46%;max-width:230px;flex:none}
.avatar svg{width:100%;height:auto}
.hero-info{
  flex:1;
  min-width:0;
  color:white;
}
.hero-info h1{
  margin:0;
  font-size:30px;
  text-shadow:2px 2px #174778;
}
.hero-info p{font-size:12px}
.notice{
  background:#fff3d4;
  border-left:4px solid #e8aa28;
  border-radius:7px;
  padding:10px;
  font-size:12px;
  line-height:1.7;
}
.stat{margin:11px 0}
.stat .row{font-size:13px;font-weight:800}
.listitem{
  padding:11px 0;
  border-bottom:1px solid #d2e2f1;
  font-size:13px;
}
small,.muted{font-size:12px;color:#637b95}
footer{
  text-align:center;
  color:white;
  font-size:11px;
  padding:20px;
}
@media(min-width:750px){
  .cards{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(3,1fr)}
}
</style>

<body>
<header>
  <div class="logo">⚾ 駿介の野球サクセス COMPLETE</div>
  <div class="subtitle">SHUNSUKE BASEBALL SUCCESS</div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="view"></main>

<script>
"use strict";

/* ==========================================
   SHUNSUKE BASEBALL SUCCESS
   COMPLETE EDITION
   第2回：基本データ・保存・キャラクター
========================================== */

const K4 = "shunsuke_success_v4";
const K3 = "shunsuke_success_v3_new";

const AB = [
  "ミート","パワー","走力",
  "肩力","守備力","捕球"
];

const PB = [
  "球威","制球力","スタミナ",
  "投球術","投手守備","メンタル"
];

const MENU = [
  ["素振り","打撃","ミート",15,"回数"],
  ["羽打ち","打撃","ミート",18,"回数"],
  ["置きティー","打撃","ミート",20,"回数"],
  ["フリーバッティング","打撃","パワー",20,"球数"],

  ["シャドーピッチング","投手","投球術",20,"回数"],
  ["キャッチボール","投手","制球力",20,"球数"],
  ["制球練習","投手","制球力",20,"球数"],
  ["配球研究","投手","投球術",20,"分"],
  ["投手フィールディング","投手","投手守備",20,"分"],

  ["ノック","守備","守備力",20,"分"],
  ["捕球練習","守備","捕球",15,"分"],
  ["送球研究","守備","肩力",15,"分"],

  ["ラダートレーニング","走塁","走力",18,"分"],
  ["ベースランニング","走塁","走力",18,"分"],
  ["走塁判断の研究","走塁","走力",18,"分"],

  ["ストレッチ","身体ケア","ケア",25,"分"],
  ["体幹・姿勢ケア","身体ケア","ケア",25,"分"],
  ["睡眠・休養","身体ケア","ケア",25,"時間"],

  ["野球ノート","自主学習","投球術",20,"分"],
  ["試合動画の研究","自主学習","投球術",20,"分"]
];

const today = () => {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
};

const esc = s => String(s ?? "").replace(
  /[&<>"']/g,
  c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

const num = (v,d=0) =>
  Number.isFinite(Number(v)) ? Number(v) : d;

const cap = (v,a=0,b=100) =>
  Math.max(a,Math.min(b,num(v)));

function fresh(){
  return {
    version:4,
    name:"駿介",
    hand:"右投右打",
    positions:["投手","一塁手","三塁手"],
    xp:0,
    energy:100,

    abilities:Object.fromEntries(
      AB.map(x=>[x,20])
    ),

    pitch:Object.fromEntries(
      PB.map(x=>[x,20])
    ),

    practice:[],
    games:[],
    growth:[],
    pitchlog:[],
    plans:[],
    reflections:[],
    missionClaims:[],

    week:Array(7).fill("休養"),

    goal:"",
    longGoal:"プロ野球選手を目指す",
    father:"自分で考え、自分で挑戦しよう！",

    pain:false,
    created:today()
  };
}

let db;

function normalizeData(data){
  const base = fresh();

  const merged = Object.assign(
    base,
    data || {}
  );

  merged.version = 4;

  for(const key of [
    "practice","games","growth",
    "pitchlog","plans","reflections",
    "missionClaims"
  ]){
    if(!Array.isArray(merged[key])){
      merged[key] = [];
    }
  }

  merged.abilities = Object.assign(
    {},
    base.abilities,
    merged.abilities || {}
  );

  merged.pitch = Object.assign(
    {},
    base.pitch,
    merged.pitch || {}
  );

  if(!Array.isArray(merged.positions)){
    merged.positions = base.positions;
  }

  if(!Array.isArray(merged.week)){
    merged.week = base.week;
  }

  return merged;
}

function load(){
  try{
    const old = JSON.parse(
      localStorage.getItem(K4)
    );

    if(old && old.version === 4){
      return normalizeData(old);
    }

    const v3 = JSON.parse(
      localStorage.getItem(K3)
    );

    if(v3 && v3.version === 3){
      const migrated = fresh();

      [
        "xp","energy","abilities",
        "practice","games","growth",
        "week","goal","father"
      ].forEach(key=>{
        if(v3[key] !== undefined){
          migrated[key] = v3[key];
        }
      });

      migrated.migrated = true;

      return normalizeData(migrated);
    }

  }catch(e){
    console.error("読み込みエラー",e);
  }

  return fresh();
}

db = load();

/*
  既存のV4.2データを上書きしないよう、
  初期表示時には自動保存しません。
  実際に記録を変更したときだけ保存します。
*/

function save(){
  try{
    localStorage.setItem(
      K4,
      JSON.stringify(db)
    );
    return true;
  }catch(e){
    alert("データを保存できませんでした。");
    return false;
  }
}

/* ===== レベル・能力 ===== */

function level(){
  return Math.floor(
    Math.sqrt(Math.max(0,num(db.xp))/100)
  )+1;
}

function xpRate(){
  const l = level();
  const start = 100*(l-1)*(l-1);
  const end = 100*l*l;

  return cap(
    (num(db.xp)-start)/(end-start)*100
  );
}

function rank(v){
  const n = cap(v);

  if(n>=90)return "S";
  if(n>=80)return "A";
  if(n>=65)return "B";
  if(n>=50)return "C";
  if(n>=35)return "D";
  return "E";
}

function totalAbility(){
  const values = [
    ...AB.map(x=>num(db.abilities[x],20)),
    ...PB.map(x=>num(db.pitch[x],20))
  ];

  return Math.round(
    values.reduce((a,b)=>a+b,0) /
    values.length
  );
}

function lastGrowth(){
  return [...db.growth]
    .sort((a,b)=>
      String(b.date).localeCompare(
        String(a.date)
      )
    )[0] || {};
}

function count(name){
  return db.practice.filter(
    x=>x.name===name
  ).length;
}

function statBar(name,value){
  const v = cap(value);

  return `
    <div class="stat">
      <div class="row">
        <span>${esc(name)}</span>
        <strong>${rank(v)} ${v}</strong>
      </div>
      <div class="bar">
        <span style="width:${v}%"></span>
      </div>
    </div>
  `;
}

====================================== */

<script>
/* ==========================================
   SHUNSUKE BASEBALL SUCCESS
   第3回：ホーム・プロフィール・称号
========================================== */

const tabs = [
  ["home","🏠 ホーム"],
  ["profile","📋 プロフィール"],
  ["training","💪 練習"],
  ["pitcher","🔥 投手"],
  ["game","🏆 試合"],
  ["growth","📈 成長"],
  ["plan","📝 自主計画"],
  ["awards","⭐ 称号"],
  ["settings","⚙️ 設定"]
];

let tab = "home";

function go(t){
  tab = t;
  render();
  window.scrollTo(0,0);
}

function render(){
  document.getElementById("nav").innerHTML =
    tabs.map(([id,name])=>`
      <button
        class="${tab===id?"active":""}"
        onclick="go('${id}')">
        ${name}
      </button>
    `).join("");

  const screens = {
    home,profile,training,pitcher,
    game,growth,plan,awards,settings
  };

  document.getElementById("view").innerHTML =
    screens[tab]();

  if(tab==="training" &&
     typeof fillMenu==="function"){
    fillMenu();
  }
}

function box(title,content){
  return `
    <section class="panel">
      <h2>${title}</h2>
      ${content}
    </section>
  `;
}

/* ===== 特殊能力・称号 ===== */

const TITLE_RULES = [
  ["努力のルーキー",()=>db.practice.length>=1,
   "初めて練習を記録する"],

  ["練習の継続者",()=>db.practice.length>=10,
   "練習を10回記録する"],

  ["努力の鉄人",()=>db.practice.length>=30,
   "練習を30回記録する"],

  ["初陣の勇者",()=>db.games.length>=1,
   "初めて試合を記録する"],

  ["ヒットメーカー",()=>
    db.games.reduce((s,x)=>s+num(x.hits),0)>=10,
   "通算10安打"],

  ["マウンドへの第一歩",()=>db.pitchlog.length>=1,
   "投球データを記録する"],

  ["投手研究家",()=>db.pitchlog.length>=5,
   "投球記録を5回つける"],

  ["野球脳○",()=>count("配球研究")>=5,
   "配球研究を5回記録する"],

  ["考える選手",()=>db.reflections.length>=5,
   "振り返りを5回記録する"],

  ["回復の達人",()=>
    db.practice.filter(x=>x.kind==="身体ケア").length>=5,
   "身体ケアを5回記録する"],

  ["未来の主役",()=>level()>=10,
   "レベル10に到達する"]
];

const PITCH_SKILLS = [
  ["🎯 制球力○",3,
   "ストライク率60%以上の記録を3回"],

  ["🧠 投球術○",5,
   "配球研究を5回"],

  ["🧤 投手守備○",5,
   "投手フィールディングを5回"],

  ["🔥 マウンド経験○",5,
   "投球記録を5回"],

  ["📖 研究熱心",10,
   "野球ノート・配球研究を合計10回"],

  ["💪 回復上手",10,
   "身体ケアを10回"],

  ["⭐ 自主性○",5,
   "自主計画を5回"],

  ["🏆 振り返り上手",10,
   "振り返りを10回"]
];

function pitchSkillProgress(){
  const valid = db.pitchlog.filter(x=>
    num(x.pitches)>0 &&
    num(x.strikes)>=0 &&
    num(x.strikes)<=num(x.pitches)
  );

  return [
    valid.filter(x=>
      num(x.strikes)/num(x.pitches)>=0.6
    ).length,
    count("配球研究"),
    count("投手フィールディング"),
    db.pitchlog.length,
    count("野球ノート")+count("配球研究"),
    db.practice.filter(x=>x.kind==="身体ケア").length,
    db.plans.length,
    db.reflections.length
  ];
}

function badges(){
  return TITLE_RULES
    .filter(x=>x[1]())
    .map(x=>x[0]);
}

function skillCards(){
  const progress = pitchSkillProgress();

  return `
    <div class="cards">
      ${PITCH_SKILLS.map((x,i)=>{
        const done = progress[i]>=x[1];
        const pct = Math.min(
          100,
          progress[i]/x[1]*100
        );

        return `
          <div class="card"
               style="opacity:${done?1:0.7}">
            <b>${done?"🌟":"🔒"} ${x[0]}</b>

/* ===== 週間ミッション ===== */

const MISSION_LIST = [
  ["📖 野球ノート",
   "自分の考えをノートに記録する",
   "野球ノート"],

  ["🧠 配球研究",

  ["🎯 自主計画",
   "自分で練習計画を立てる",
   "自主計画"],

  ["✍️ 振り返り",
   "今日の成長を言葉にする",
   "振り返り"]
];

function weekStart(){
  const d = new Date();
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);

  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function missionProgress(i){
  const start = weekStart();

  if(i===0){
    return db.practice.some(x=>
      x.date>=start &&
      x.name==="野球ノート"
    );
  }

  if(i===1){
    return db.practice.some(x=>
      x.date>=start &&
      x.name==="配球研究"
    );
  }

  if(i===2){
    return db.practice.some(x=>
      x.date>=start &&
      x.kind==="身体ケア"
    );
  }

  if(i===3){
    return db.plans.some(x=>
      x.date>=start
    );
  }

  return db.reflections.some(x=>
    x.date>=start
  );
}

function missionHTML(){
  const claims = db.missionClaims || [];
  const start = weekStart();

  return MISSION_LIST.map((m,i)=>{
    const achieved = missionProgress(i);
    const claimed = claims.some(x=>
      x.week===start && x.id===i
    );

    return `
      <div class="listitem">
        <div class="row">
          <div>
            <b>${m[0]}</b>
            <small>${m[1]}</small>
          </div>
          <button
            class="btn ${claimed?"ghost":"blue"}"
            ${!achieved||claimed?"disabled":""}
            onclick="claimMission(${i})">
            ${claimed?"達成済み":
              achieved?"報酬獲得":"未達成"}
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function claimMission(i){
  if(!Number.isInteger(i) ||
     i<0 || i>=MISSION_LIST.length)return;

  if(!missionProgress(i)){
    alert("まだミッションを達成していません。");
    return;
  }

  const start = weekStart();

  if(db.missionClaims.some(x=>
    x.week===start && x.id===i
  )){
    alert("今週の報酬は獲得済みです。");
    return;
  }

  db.missionClaims.push({
    week:start,
    id:i,
    date:today()
  });

  db.xp += 10;
  save();

  alert("ミッション達成！ +10 XP");
  render();
}

function fillMenu(){
  const category =
    document.getElementById("trainingCategory");

  const menu =
    document.getElementById("trainingMenu");

  menu.innerHTML = TRAINING_MENU
    .filter(x=>x[1]===category.value)
    .map(x=>`
      <option value="${esc(x[0])}">
        ${esc(x[0])}
      </option>
    `).join("");

  updateTrainingUnit();
}

function updateTrainingUnit(){
  const el = document.getElementById("trainingMenu");
  if(!el)return;

  const item = TRAINING_MENU.find(x=>
    x[0]===el.value
  );

  const label =
    document.getElementById("trainingUnitLabel");

  if(label){
    label.textContent =
      "実施量（"+(item?item[4]:"回")+"）";
  }
}

/* ===== 練習保存 ===== */

function addPractice(){
  const name =
    document.getElementById("trainingMenu").value;

  const item = TRAINING_MENU.find(x=>
    x[0]===name
  );

  if(!item)return;

  const date =
    document.getElementById("trainingDate").value;

  const pain =
    document.getElementById("trainingPain").value
    ==="yes";

  const rawAmount =
    document.getElementById("trainingAmount").value;

  const amount = rawAmount===""?
    null:Number(rawAmount);

  const note =
    document.getElementById("trainingNote")
      .value.trim();

  if(!date){
    alert("練習日を入力してください。");
    return;
  }

  if(amount!==null &&
     (!Number.isFinite(amount)||amount<0)){
    alert("実施量を確認してください。");
    return;
  }

  const restOrStudy =
    item[0]==="睡眠・休養" ||
    item[1]==="自主学習";

  if(pain && !restOrStudy){
    db.pain = true;
    save();

    alert(
      "痛みがある場合、運動は記録せず、"+
      "医師の指示を優先してください。"+
      "休養や野球ノートを選びましょう。"
    );
    return;
  }

  const already = db.practice.filter(x=>
    x.date===date
  ).length;

  // 同じ日に何度も記録して
  // 経験値を増やしすぎない仕組み
  const xp = already>=3?5:item[3];

  db.practice.push({
    date:date,
    name:item[0],
    kind:item[1],
    xp:xp,
    amount:amount,
    unit:item[4],
    note:note
  });

  db.xp += xp;
  db.pain = pain;

  if(item[2]==="ケア"){
    db.energy = cap(db.energy+10);
  }else if(!pain){
    db.energy = cap(db.energy-5);

    const target = PB.includes(item[2])?
      db.pitch:db.abilities;

    if(target[item[2]]!==undefined){
      target[item[2]] = cap(
        num(target[item[2]],20)+1
      );
    }
  }

  save();

  alert(
    "練習記録完了！\n"+
    "+"+xp+" XP 獲得！"
  );

  render();
}

/* ===== 投球記録保存 ===== */

function addPitch(){
  const date =
    document.getElementById("pitchDate").value;

  const p = Number(
    document.getElementById("pitches").value
  );

  const s = Number(
    document.getElementById("strikes").value
  );

  const rawSpeed =
    document.getElementById("speed").value;

  const speed = rawSpeed===""?
    null:Number(rawSpeed);

  const pain =
    document.getElementById("pitchPain").value
    ==="yes";

  const note =
    document.getElementById("pitchNote")
      .value.trim();

  if(!date){
    alert("投球日を入力してください。");
    return;
  }

  if(!Number.isInteger(p) ||
     !Number.isInteger(s) ||
     p<0 || s<0 || s>p){
    alert("投球数とストライク数を確認してください。");
    return;
  }

  if(speed!==null &&
     (!Number.isFinite(speed)||speed<=0)){
    alert("球速を確認してください。");
    return;
  }

  if(pain){
    db.pain = true;
  }

  db.pitchlog.push({
    date:date,
    pitches:p,
    strikes:s,
    speed:speed,
    pain:pain,
    note:note
  });

  save();

  if(pain){
    alert(
      "記録を保存しました。\n"+
      "痛みがある場合は投球を中止し、"+
      "医療者に相談してください。"
    );
  }else{
    alert("投球データを保存しました！");
  }

  render();
}
</script>

<script>

/* ===== 試合成績 ===== */

function gameTotals(){
  const sum = key => db.games.reduce(
    (s,x)=>s+num(x[key]),0
  );

  const pa=sum("pa"),ab=sum("ab"),h=sum("hits");
  const bb=sum("walks"),hbp=sum("hbp"),sf=sum("sf");
  const doubles=sum("doubles"),triples=sum("triples");
  const hr=sum("hr");
  const singles=Math.max(0,h-doubles-triples-hr);
  const tb=singles+2*doubles+3*triples+4*hr;

  return {
    games:db.games.length,
    pa,ab,h,hr,
    rbi:sum("rbi"),
    steals:sum("steals"),
    avg:ab?(h/ab).toFixed(3).replace(/^0/,""):"---",
    obp:(ab+bb+hbp+sf)?
      ((h+bb+hbp)/(ab+bb+hbp+sf)).toFixed(3).replace(/^0/,""):"---",
    slg:ab?(tb/ab).toFixed(3).replace(/^0/,""):"---"
  };
}

function addGame(){
  const keys=[

  for(const k of keys){

      alert("試合成績は0以上の整数で入力してください。");
      return;

  }

  if(!x.date){
    alert("試合日を入力してください。");
    return;
  }

  if(x.hits>x.ab ||
     x.doubles+x.triples+x.hr>x.hits ||
     x.ab+x.walks+x.hbp+x.sf>x.pa){
    alert("打席数・打数・安打・長打の内訳を確認してください。");
    return;

/* ===== 成長記録 ===== */

function growthGraph(key,unit){
  const rows=db.growth
    .filter(x=>Number.isFinite(Number(x[key])) &&
      x[key]!=="" && x[key]!==null && Number(x[key])>0)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)))
    .slice(-15);

  if(!rows.length)return "<p>まだ記録がありません。</p>";

  const vals=rows.map(x=>Number(x[key]));
  const min=Math.min(...vals);
  const max=Math.max(...vals);
  const span=Math.max(1,max-min);

  const points=vals.map((v,i)=>[
    35+i*260/Math.max(1,vals.length-1),
    112-(v-min)/span*78
  ]);

  const path=points.map((p,i)=>
    (i?"L":"M")+p[0]+" "+p[1]
  ).join(" ");

  return `
    <svg viewBox="0 0 330 155"
      style="width:100%;background:#f0f7ff;border-radius:10px"
      role="img" aria-label="${esc(key)}の推移">
      <path d="M35 22 V112 H300"
        stroke="#b4cbe4" stroke-width="2" fill="none"/>
      <path d="${path}" stroke="#176cc7"
        stroke-width="4" fill="none"/>
      ${points.map(p=>`
        <circle cx="${p[0]}" cy="${p[1]}"
          r="4" fill="#ffca37"/>
      `).join("")}
      <text x="5" y="28" font-size="10">${max}${unit}</text>
      <text x="5" y="112" font-size="10">${min}${unit}</text>
      <text x="35" y="140" font-size="10">
        ${esc(rows[0].date)}
      </text>
      <text x="300" y="140" font-size="10" text-anchor="end">
        ${esc(rows[rows.length-1].date)}
      </text>
    </svg>
  `;
}

function backup(){
  try{
    const json=JSON.stringify(db,null,2);

    const blob=new Blob(
      [json],
      {type:"application/json;charset=utf-8"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");
    a.href=url;
    a.download=
      "shunsuke-backup-"+today()+".json";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },1000);

  }catch(e){
    console.error(e);
    alert("バックアップを作成できませんでした。");
  }
}

/* ===== JSONバックアップ復元 ===== */

async function restoreData(){
  const input=document.getElementById(
    "restoreFile"
  );

  if(!input.files || !input.files[0]){
    alert("JSONファイルを選択してください。");
    return;
  }

  if(!confirm(
    "現在の記録が置き換わります。\n"+
    "バックアップを取ってから復元しますか？"
  )){
    return;
  }

  try{
    const file=input.files[0];

    const text=await file.text();
    const restored=JSON.parse(text);

    if(!restored ||
       typeof restored!=="object" ||
       Array.isArray(restored)){
      throw new Error("データ形式が正しくありません");
    }

    if(restored.version!==3 &&
       restored.version!==4){
      throw new Error(
        "対応していないバックアップです"
      );
    }

    if(restored.version===3){
      const migrated=fresh();

      [
        "name","xp","energy","abilities",
        "practice","games","growth",
        "week","goal","father"
      ].forEach(key=>{
        if(restored[key]!==undefined){
          migrated[key]=restored[key];
        }
      });

      db=normalizeData(migrated);

    }else{
      db=normalizeData(restored);
    }

    if(!save()){
      throw new Error("保存に失敗しました");
    }

    alert(
      "バックアップを復元しました！\n"+
      "練習 "+db.practice.length+"件\n"+
      "経験値 "+db.xp+" XP"
    );

    go("home");

  }catch(e){
    console.error(e);
    alert(
      "復元できませんでした。\n"+
      e.message
    );
  }
}

/* ===== アプリ起動 ===== */

try{

}

<script>

/* ==========================================
   SHUNSUKE SUCCESS 2027
   第1弾：努力・生活・週間レビュー

========================================== */

function s27data(){
  if(!db.success2027 ||
     typeof db.success2027!=="object" ||
     Array.isArray(db.success2027)){
    db.success2027={};
  }
  const d=db.success2027;
  for(const k of [
    "quick","sleep","meals",
    "condition","reviews"
  ]){
    if(!Array.isArray(d[k]))d[k]=[];
  }
  return d;
}

function s27sum(rows,key){
  return rows.reduce((s,x)=>
    s+Math.max(0,num(x[key])),0);
}

function s27dateOffset(date,n){
  const p=String(date).split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]+n);
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}

function s27week(date){
  const p=String(date).split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]);
  const shift=(d.getDay()+6)%7;
  return s27dateOffset(date,-shift);
}

function s27allPractice(){
  const old=db.practice.map(x=>({
    date:x.date,
    name:x.name,
    kind:x.kind,
    amount:num(x.amount),
    unit:x.unit||"",
    minutes:num(x.minutes),
    note:x.note||""
  }));
  const extra=s27data().quick.map(x=>({
    date:x.date,
    name:x.name,
    kind:x.kind,
    amount:num(x.amount),
    unit:x.unit||"",
    minutes:num(x.minutes),
    note:x.note||""
  }));
  return old.concat(extra);
}

function s27stats(start,end){
  const rows=s27allPractice().filter(x=>
    x.date>=start && x.date<=end
  );
  const swings=rows.filter(x=>
    x.name==="素振り" &&
    (x.unit==="回" || x.unit==="回数")
  );
  const minutes=s27sum(rows,"minutes");
  const byKind={};
  for(const x of rows){
    const k=x.kind||"その他";
    byKind[k]=(byKind[k]||0)+num(x.minutes);
  }
  const days=new Set(rows.map(x=>x.date)).size;
  return {
    swings:s27sum(swings,"amount"),
    minutes,days,byKind,rows
  };
}

function s27sleepAverage(days){
  const end=today();
  const start=s27dateOffset(end,1-days);
  const rows=s27data().sleep.filter(x=>
    x.date>=start && x.date<=end &&
    num(x.hours)>0
  );
  if(!rows.length)return "—";
  return (s27sum(rows,"hours")/rows.length)
    .toFixed(1);
}

  if(db.pain && kind!=="身体ケア"){

/* 記録した日付を集める */
function s29recordDates(){
  const dates=new Set();

  function collect(rows){
    if(!Array.isArray(rows))return;

    rows.forEach(x=>{
      if(x && /^\d{4}-\d{2}-\d{2}$/.test(
        String(x.date||"")
      )){
        dates.add(x.date);
      }
    });
  }

  collect(db.practice);
  collect(db.games);
  collect(db.growth);
  collect(db.pitchlog);
  collect(db.plans);
  collect(db.reflections);

  const d=s27data();
  collect(d.quick);
  collect(d.sleep);
  collect(d.meals);
  collect(d.condition);

  return dates;
}

/* 今日または昨日からの連続記録日数 */
function s29streak(){
  const dates=s29recordDates();
  let day=today();

  if(!dates.has(day)){
    day=s27dateOffset(day,-1);
  }

  let streak=0;

  while(dates.has(day) && streak<10000){
    streak++;
    day=s27dateOffset(day,-1);
  }

  return streak;
}

/* 今週のチャレンジ */
function s29missions(){
  const start=weekStart();
  const end=s27dateOffset(start,6);
  const d=s27data();

  const inWeek=x=>
    x && x.date>=start && x.date<=end;

  const all=s27allPractice().filter(inWeek);

  const notebook=all.some(x=>
    x.name==="野球ノート"
  );

  const care=all.some(x=>
    x.kind==="身体ケア"
  );

  const reflection=db.reflections.some(inWeek);

  const sleepDays=new Set(
    d.sleep.filter(inWeek)
      .filter(x=>Number(x.hours)>0)
      .map(x=>x.date)
  ).size;

  return [
    {
      title:"📖 考える野球",
      description:"野球ノートを1回記録",
      done:notebook
    },
    {
      title:"🧘 身体を大切に",

}
