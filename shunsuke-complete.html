       "ボールをよく見る"],
      ["送球の方向を意識する",
       "無理のない動きを確認する"],
      ["一歩目を意識する",
       "準備を早くする"]
    ]
  }
];

function s13Topics(category){
  if(S13_TOPICS[category]){
    return S13_TOPICS[category];
  }
  return S13_FIELD_DEFAULT;
}

function s13Notes(){
  return Array.isArray(
    db.baseballNotebook11?.notes
  )?db.baseballNotebook11.notes:[];
}

function s13Esc(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

let s13State=null;

function s13Close(){
  const el=document.getElementById("s13Overlay");
  if(el)el.remove();
  s13State=null;
}

window.s13Close=s13Close;

function s13Options(){
  const s=s13State;
  if(!s)return [];

  const topics=s13Topics(s.category);

  if(s.step===0){
    return topics.map(x=>x.title);
  }

  const topic=topics[s.topic];
  if(!topic)return [];

  if(s.step===1){
    return topic.details;
  }

  return topic.actions[s.detail]||[];
}

function s13Question(){
  const s=s13State;
  if(!s)return "";

  if(s.step===0){
    return "どんなことが難しかった？";
  }

  if(s.step===1){
    const topic=s13Topics(s.category)[s.topic];
    return "「"+topic.title+
      "」のは、どんな場面だった？";
  }

  return "次は何を試してみたい？";
}

function s13Render(){
  const s=s13State;
  const overlay=document.getElementById(
    "s13Overlay"
  );
  if(!s||!overlay)return;

  const options=s13Options();
  const selected=s.answers[s.step]||"";

  const box=overlay.querySelector(".s13-dialog");

  box.innerHTML=`
    <h2>🧠 考える野球コーチ</h2>

    <p>
      ${s13Esc(
        S13_CATEGORIES[s.category]||"野球"
      )}の振り返り
    </p>

    <p class="s13-mini">
      ${s13Esc(s.date)} の野球ノートに保存
    </p>

    <div class="s13-progress">
      ${[0,1,2].map(i=>`
        <span class="${i<=s.step?"on":""}"></span>
      `).join("")}
    </div>

    <p><b>質問 ${s.step+1} / 3</b></p>

    <div class="s13-question">
      ${s13Esc(s13Question())}
    </div>

    <div class="s13-options">
      ${options.map((v,i)=>`
        <button type="button"
          class="s13-option ${
            selected===v?"selected":""
          }"
          onclick="s13Choose(${i})">
          ${s13Esc(v)}
        </button>
      `).join("")}
    </div>

    <p>
      <b>自分の言葉でも書いてみよう（任意）</b>
    </p>

    <textarea id="s13Free"
      placeholder="短い言葉でもOK！">${s13Esc(
        s.free[s.step]||""
      )}</textarea>

    <div class="s13-actions">
      <button class="secondary"
        onclick="s13Back()">
        ${s.step===0?"やめる":"← 戻る"}
      </button>

      <button onclick="s13Next()">
        ${s.step===2?
          "📓 ノートに保存":
          "次の質問へ →"}
      </button>
    </div>

    <p class="s13-mini">
      正解は一つじゃないよ。
      自分が感じたことを大切にしよう！
    </p>
  `;
}

window.s13Choose=function(i){
  if(!s13State)return;

  const options=s13Options();
  const value=options[i];
  if(value===undefined)return;

  const s=s13State;
  const old=s.answers[s.step];

  s.answers[s.step]=value;

  if(s.step===0){
    const nextTopic=i;
    if(s.topic!==nextTopic || old!==value){
      s.topic=nextTopic;
      s.detail=-1;
      s.answers[1]="";
      s.answers[2]="";
      s.free[1]="";
      s.free[2]="";
    }
  }

  if(s.step===1){
    if(s.detail!==i || old!==value){
      s.detail=i;
      s.answers[2]="";
      s.free[2]="";
    }
  }

  s13Render();
};

window.s13Back=function(){
  if(!s13State)return;

  const free=document.getElementById("s13Free");
  if(free){
    s13State.free[s13State.step]=free.value;
  }

  if(s13State.step===0){
    s13Close();
    return;
  }

  s13State.step--;
  s13Render();
};

window.s13Next=function(){
  const s=s13State;
  if(!s)return;

  const free=document.getElementById("s13Free");
  s.free[s.step]=free?free.value.trim():"";

  if(!s.answers[s.step] && !s.free[s.step]){
    alert(
      "一つ選ぶか、自分の言葉で答えてみよう！"
    );
    return;
  }

  if(s.step<2){
    // 自由記述だけの場合にも次へ進める。
    // その場合は共通質問を使用する。
    if(s.step===0 && s.topic<0){
      s.topic=0;
    }
    if(s.step===1 && s.detail<0){
      s.detail=0;
    }

    s.step++;
    s13Render();
    return;
  }

  s13Save();
};

function s13Answer(s,i){
  return [
    s.answers[i],
    s.free[i]
  ].filter(Boolean).join("。");
}

function s13Save(){
  const s=s13State;
  if(!s)return;

  const notes=s13Notes();
  const note=notes[s.index];

  if(!note){
    alert("保存先の野球ノートが見つかりません。");
    s13Close();
    return;
  }

  const before=JSON.stringify(db);

  const record={
    date:new Date().toLocaleDateString("ja-JP"),
    category:s.category,
    questions:[
      "どんなことが難しかった？",
      "どんな場面だった？",
      "次は何を試してみたい？"
    ],
    answers:[
      s13Answer(s,0),
      s13Answer(s,1),
      s13Answer(s,2)
    ]
  };

  if(!Array.isArray(note.deepDives)){
    note.deepDives=[];
  }

  note.deepDives.push(record);

  try{
    if(save()===false){
      throw new Error("保存失敗");
    }
  }catch(e){
    db=JSON.parse(before);
    alert("保存できませんでした。");
    return;
  }

  s13Close();

  alert(
    "🏆 深掘りノート完成！\n\n"+
    "自分で考えたことが成長につながるよ！"
  );

  render();
}

window.s13Start=function(index){
  const note=s13Notes()[index];
  if(!note)return;

  s13Close();

  s13State={
    index:index,
    date:note.date||"",
    category:note.category||"bat",
    step:0,
    topic:-1,
    detail:-1,
    answers:["","",""],
    free:["","",""]
  };

  const overlay=document.createElement("div");
  overlay.id="s13Overlay";
  overlay.className="s13-overlay";

  const dialog=document.createElement("div");
  dialog.className="s13-dialog";
  dialog.setAttribute("role","dialog");
  dialog.setAttribute("aria-modal","true");

  overlay.appendChild(dialog);
  document.body.appendChild(overlay);

  s13Render();
};

/* 保存済みノートに深掘りボタンと履歴を追加 */

function s13EnhanceNotebook(){
  if(tab!=="baseballNotebook11")return;

  const notes=s13Notes();
  const cards=document.querySelectorAll(".s11-note");

  cards.forEach(card=>{
    const copy=card.querySelector(
      '[onclick^="s11CopyNote("]'
    );
    if(!copy)return;

    const match=copy.getAttribute(
      "onclick"
    ).match(/\((\d+)\)/);

    if(!match)return;

    const index=Number(match[1]);
    const note=notes[index];
    if(!note)return;

    if(!card.querySelector(".s13-start")){
      const button=document.createElement("button");
      button.className="s13-start";
      button.textContent=
        "🧠 もっと深く考えてみる！";
      button.onclick=()=>window.s13Start(index);

      copy.insertAdjacentElement(
        "beforebegin",button
      );
    }

    if(!Array.isArray(note.deepDives) ||
       !note.deepDives.length)return;

    if(card.querySelector(".s13-history"))return;

    const history=document.createElement("div");
    history.className="s13-history";

    const title=document.createElement("b");
    title.textContent="🧠 深掘りした記録";
    history.appendChild(title);

    note.deepDives.forEach((d,i)=>{
      const section=document.createElement("div");
      section.className="s13-history";

      const heading=document.createElement("b");
      heading.textContent=
        "振り返り "+(i+1)+" / "+(d.date||"");
      section.appendChild(heading);

      (d.answers||[]).forEach((a,j)=>{
        const p=document.createElement("p");
        p.textContent=
          "質問"+(j+1)+"："+
          (d.questions?.[j]||"")+
          "\n答え："+a;
        section.appendChild(p);
      });

      history.appendChild(section);
    });

    copy.insertAdjacentElement(
      "beforebegin",history
    );
  });
}

/* コピー時にも深掘り回答を含める。
   第12弾の追記コピー機能を残す。 */

const s13OldCopy=window.s11CopyNote;

window.s11CopyNote=function(index){
  const note=s13Notes()[index];

  if(!note || !Array.isArray(note.deepDives) ||
     !note.deepDives.length){
    return s13OldCopy(index);
  }

  const lines=[
    "【野球ノート】",
    "日付："+(note.date||""),
    "目標："+(note.goal||""),
    "練習内容："+(note.content||""),
    "意識したこと："+(note.focus||""),
    "結果・感覚："+(note.result||""),
    "良かったこと："+(note.good||""),
    "改善点："+(note.improve||""),
    "次に試すこと："+(note.next||"")
  ];

  if(Array.isArray(note.additions)){
    note.additions.forEach(a=>{
      lines.push(
        "追記："+(a.date||"")+" "+
        (a.text||"")
      );
    });
  }

  note.deepDives.forEach((d,i)=>{
    lines.push("");
    lines.push(
      "【深掘り "+(i+1)+"】"
    );

    (d.answers||[]).forEach((a,j)=>{
      lines.push(
        (d.questions?.[j]||"質問"+(j+1))+
        "："+a
      );
    });
  });

  const text=lines.join("\n");

  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>alert("ノートをコピーしました！"))
      .catch(()=>prompt(
        "この文章をコピーしてください",text
      ));
  }else{
    prompt("この文章をコピーしてください",text);
  }
};

/* 既存の描画を維持したまま追加 */

const s13OldRender=render;

render=function(){
  s13OldRender();
  s13EnhanceNotebook();

render();

<script>
(function(){
"use strict";

/*
 第14弾
 身体ケアの時間を元の練習記録から集計。
 XP・能力値・既存記録は変更しない。
*/

// 身体ケアとして認識する分類
function s14IsCare(x){
  if(!x)return false;

  const kind=String(x.kind||"");
  const name=String(x.name||"");

  // 睡眠・休養は身体ケア時間に含めない
  if(/睡眠|休養/.test(name))return false;

  return kind==="身体ケア" ||
    /ストレッチ|姿勢ケア|リカバリー/.test(name);
}

// 記録された時間を分単位に変換
function s14Minutes(x){
  if(!x)return 0;

  const minutes=Number(x.minutes);

  if(Number.isFinite(minutes) &&
     minutes>0){
    return Math.min(1440,minutes);
  }

  // 旧記録で「実施量」が分単位の場合
  if(/分/.test(String(x.unit||""))){
    const amount=Number(x.amount);
    if(Number.isFinite(amount) &&
       amount>0){
      return Math.min(1440,amount);
    }
  }

  return 0;
}

function s14Records(){
  const main=Array.isArray(db.practice)?
    db.practice:[];

  const quick=Array.isArray(
    db.success2027?.quick
  )?db.success2027.quick:[];

  return main.concat(quick);
}

function s14WeekEnd(start){
  const [y,m,d]=start.split("-").map(Number);
  const date=new Date(y,m-1,d+6);

  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function s14Stats(){
  const start=weekStart();
  const end=s14WeekEnd(start);

  const records=s14Records().filter(x=>
    x.date>=start &&
    x.date<=end &&
    s14IsCare(x)
  );

  const minutes=records.reduce(
    (sum,x)=>sum+s14Minutes(x),0
  );

  const days=new Set(
    records.filter(x=>s14Minutes(x)>0)
      .map(x=>x.date)
  ).size;

  return {
    minutes:Math.round(minutes),
    days:days,
    count:records.length,
    start:start,
    end:end
  };
}

function s14Format(minutes){
  const h=Math.floor(minutes/60);
  const m=minutes%60;

  return h?
    h+"時間"+(m?m+"分":""):
    m+"分";
}

function s14CarePanel(){
  const s=s14Stats();

  // 週3日のケアを表示上の目安とする。
  // それ以上の時間を強制するものではない。
  const progress=Math.min(
    100,Math.round(s.days/3*100)
  );

  let message;

  if(s.days>=3){
    message=
      "🏆 すばらしい！身体を大切にする習慣が続いているね！";
  }else if(s.days>=1){
    message=
      "🌱 ナイスケア！ストレッチも立派な成長だよ！";
  }else{
    message=
      "💚 身体を整えることも、強くなるための大切な一歩！";
  }

  return `
    <section class="s14-care" id="s14CarePanel">
      <h3>🧘 今週の身体ケア</h3>

      <div class="s14-care-grid">
        <div class="s14-care-stat">
          合計ケア時間
          <strong>${s14Format(s.minutes)}</strong>
        </div>
        <div class="s14-care-stat">
          ケア実施日数
          <strong>${s.days}日</strong>
        </div>
      </div>

      <div class="s14-care-bar">
        <div class="s14-care-fill"
          style="width:${progress}%">
        </div>
      </div>

      <small>
        継続の目安：週3日
        （達成のために無理に増やす必要はありません）
      </small>

      <p class="s14-care-message">
        ${message}
      </p>

      <small>
        身体ケアに分類されたストレッチなどの
        実施時間を集計しています。
        睡眠・休養は含みません。
      </small>
    </section>
  `;
}

/*
 旧集計の「今週のケア・研究」は、
 身体ケアと自主学習を合わせた数字なので
 身体ケア単独の数字と混同しないようにする。
*/

function s14EnhanceBalance(){
  const view=document.getElementById("view");
  if(!view)return;

  if(document.getElementById("s14CarePanel")){
    return;
  }

  // 「今週の練習バランス」を含む要素を探す
  const candidates=Array.from(
    view.querySelectorAll(
      "h2,h3,h4,.title,.section-title"
    )
  );

  const heading=candidates.find(el=>
    el.textContent.includes("今週の練習バランス")
  );

  const panel=document.createElement("div");
  panel.innerHTML=s14CarePanel();

  if(heading){
    // バランスの見出し直後にケア実績を表示
    heading.insertAdjacentElement(
      "afterend",panel.firstElementChild
    );
  }else{
    // 見出し構造が異なる場合はホーム内に表示
    if(tab==="home"){
      view.insertBefore(
        panel.firstElementChild,
        view.firstChild
      );
    }
  }
}

/*
 練習メニューから「睡眠・休養」を除く。
 過去に保存した睡眠・休養の記録は残す。
*/

function s14RemoveSleepMenu(){
  // メニュー定義から取り除く
  if(typeof TRAINING_MENU!=="undefined" &&
     Array.isArray(TRAINING_MENU)){
    for(let i=TRAINING_MENU.length-1;i>=0;i--){
      const name=String(TRAINING_MENU[i][0]||"");
      if(/睡眠|休養/.test(name)){
        TRAINING_MENU.splice(i,1);
      }
    }
  }

  // 画面の選択肢からも除く
  const view=document.getElementById("view");

  view.querySelectorAll("select").forEach(select=>{

      if(/睡眠|休養/.test(option.textContent)){
        option.remove();
      }
    });
  });
}

<script>
(function(){
'use strict';

const KEY='mandala15';

const THEMES=[

    ]
  ],
  [
    '体力づくり',
    [
      'ストレッチを毎日する',

      'ランニングをする'
    ]
  ],
  [
    'ピッチング',
    [

    ]
  ],
  [

    ]
  ],
  [
    '勉強',

      '忘れ物をしない',

    ]

];

const esc15=v=>String(v??'')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;');

const date15=()=>{
  const d=new Date();
  const z=n=>String(n).padStart(2,'0');

  return [
    d.getFullYear(),
    z(d.getMonth()+1),
    z(d.getDate())
  ].join('-');
};

function store(){
  if(
    !db[KEY] ||
    typeof db[KEY]!=='object' ||
    Array.isArray(db[KEY])
  ){
    db[KEY]={};
  }

  const s=db[KEY];

  if(!Array.isArray(s.themes)){
    s.themes=THEMES.map(([name,actions])=>({
      name,
      actions:Array.from(
        {length:8},
        (_,i)=>actions[i]||''
      )
    }));
  }

  if(!s.daily || typeof s.daily!=='object'){
    s.daily={};
  }

  if(!Array.isArray(s.history)){
    s.history=[];
  }

  if(typeof s.dream!=='string'){
    s.dream=String(
      db.goal||'プロ野球選手になる！'
    );
  }

  if(typeof s.medium!=='string'){
    s.medium='';
  }

  if(typeof s.short!=='string'){
    s.short='';
  }

  return s;
}

function persist(fn){
  const before=JSON.stringify(db);

  try{
    fn();

    if(save()===false){
      throw Error('保存失敗');
    }

    return true;

  }catch(e){
    db=JSON.parse(before);

    alert(
      '保存できませんでした。' +
      'データ管理から保存容量を確認してください。'
    );

    return false;
  }
}

function entries(){
  return store().themes.flatMap(
    (t,ti)=>t.actions.map((a,ai)=>({
      id:`${ti}-${ai}`,
      theme:t.name,
      text:a
    }))
  ).filter(x=>x.text.trim());
}

function day(){
  const s=store();
  const d=date15();

  if(!s.daily[d]){
    s.daily[d]={
      chosen:[],
      checked:[],
      reflection:'',
      rest:false
    };
  }

  return s.daily[d];
}

function progress(){
  const d=day();

  return d.chosen.length
    ?Math.round(
      d.chosen.filter(
        id=>d.checked.includes(id)
      ).length/d.chosen.length*100
    )
    :0;
}

function todayPanel(){
  const s=store();
  const d=day();
  const all=entries();

  const chosen=d.chosen
    .map(id=>all.find(x=>x.id===id))
    .filter(Boolean);

  return `
    <section class="m15-panel m15-home">

      <div class="m15-dream">

      </div>

      </h3>

        休養日には無理をしないことも大切。
      </p>

      ${

        ?`
          <div class="m15-actions">
            ${chosen.map(x=>`
              <div class="m15-item">
                <label>
                  <input
                    type="checkbox"
                    ${
                      d.checked.includes(x.id)
                      ?'checked'
                      :''
                    }
                    onchange="m15Check(
                      '${x.id}',this.checked
                    )"
                  >

                  <span>
                    <b>${esc15(x.theme)}</b>：

                  </span>

              </div>

          <div class="m15-progress">
            <span style="width:${progress()}%">
            </span>
          </div>
        `
        :`
          <p>
            今日はまだ約束を選んでいないよ。
          </p>
        `
      }

      <div
        class="m15-row"
        style="margin-top:12px"
      >
        <button onclick="go('mandala15')">

        </button>

        <button
          class="alt"
          onclick="m15Reflect()"
        >
          🌙 今日の振り返り
        </button>
      </div>

      ${
        d.rest
        ?`
          <p>
            💚 今日は休養日。
            身体を大切にする選択も立派だよ。
          </p>
        `
        :''
      }

    </section>
  `;
}

function grid(){
  const s=store();
  const cells=[];

  for(let by=0;by<3;by++){
    for(let iy=0;iy<3;iy++){

      const row=[];

      for(let bx=0;bx<3;bx++){
        for(let ix=0;ix<3;ix++){

          const group=by*3+bx;
          const inner=iy*3+ix;

          if(group===4){

            if(inner===4){
              row.push({
                text:s.dream,
                kind:'center'
              });

            }else{
              const k=inner<4
                ?inner
                :inner-1;

              row.push({
                text:s.themes[k].name,
                kind:'theme',
                ti:k
              });
            }

          }else{
            const ti=group<4
              ?group
              :group-1;

            if(inner===4){
              row.push({
                text:s.themes[ti].name,
                kind:'theme',
                ti
              });

            }else{
              const ai=inner<4
                ?inner
                :inner-1;

              row.push({
                text:s.themes[ti].actions[ai],
                kind:'action',
                ti,
                ai
              });
            }
          }
        }
      }

      cells.push(...row);
    }
  }

  const d=day();

  return `
    <div class="m15-scroll">
      <div class="m15-grid">

        ${cells.map(c=>`
          <button
            type="button"
            class="m15-cell ${c.kind} ${
              c.kind==='action' &&
              d.checked.includes(
                `${c.ti}-${c.ai}`
              )
              ?'done'
              :''
            }"
            onclick="m15Edit(
              ${c.ti??-1},
              ${c.ai??-1}
            )"
            title="タップして編集"
          >
            ${esc15(c.text||'＋')}
          </button>
        `).join('')}

      </div>
    </div>
  `;
}

function screen(){
  const s=store();
  const d=day();
  const all=entries();

  return `
    <section class="m15-panel">

      <h2>🏆 夢をかなえる81マス</h2>

      <p>
        真ん中に夢、周囲に8つのテーマ、
        さらに各8つの行動。
        マスをタップして編集できます。
      </p>

      ${grid()}

      <p class="m15-muted">
        横にスクロールして全81マスを
        確認できます。
        空白のマスも自由に追加できます。
      </p>

    </section>

    <section class="m15-panel">

      <h3>🎯 長期・中期・短期目標</h3>

      <label>
        長期目標（81マスの中心と共通）

        <input
          id="m15Dream"
          type="text"
          value="${esc15(s.dream)}"
        >
      </label>

      <label>
        中期目標

        <input
          id="m15Short"

      </button>

    </section>

    <section class="m15-panel">

      </p>

      <div class="m15-actions">

        `).join('')}

      </div>

      <button

        onclick="m15Choose()"
      >
        ⭐ 今日の約束を保存
      </button>

      <p class="m15-muted">

      </p>

    </section>

    <section class="m15-panel">

      <h3>🌙 今日の振り返り</h3>

      <label>
        <input

      ${
        Object.keys(s.daily)

          .slice(0,14)
          .map(date=>{

            const x=s.daily[date];

            const completed=(x.checked||[])
              .filter(
                id=>(x.chosen||[]).includes(id)
              ).length;

            return `
              <div class="m15-item">

                <b>${esc15(date)}</b>

                ${x.rest?'💚休養 ':''}

                ${completed}/${(x.chosen||[]).length}
                達成

                <p>
                  ${esc15(x.reflection||'')}
                </p>

              </div>
            `;
          }).join('')
          ||
          '<p>これから記録を増やしていこう！</p>'
      }

    </section>
  `;
}

window.m15Edit=(ti,ai)=>{
  const s=store();

  if(ti<0){
    const v=prompt(
      '中心の夢を入力',
      s.dream
    );

    if(
      v!==null &&
      v.trim() &&
      persist(()=>{
        s.dream=v.trim();
        db.goal=s.dream;

        s.history.push({
          date:date15(),
          type:'dream',
          value:v.trim()
        });
      })
    ){
      render();
    }

    return;
  }

  const item=s.themes[ti];
  const isTheme=ai<0;

  const old=isTheme
    ?item.name
    :item.actions[ai];

  const v=prompt(
    isTheme
      ?'テーマ名を編集'
      :'行動目標を編集（空欄も可）',
    old
  );

  if(
    v!==null &&
    persist(()=>{

      if(isTheme){
        item.name=v.trim();
      }else{
        item.actions[ai]=v.trim();
      }

      s.history.push({
        date:date15(),
        type:isTheme?'theme':'action',
        id:`${ti}-${ai}`,
        before:old,
        after:v.trim()
      });
    })
  ){
    render();
  }
};

window.m15SaveGoals=()=>{
  const s=store();

  const dream=document
    .getElementById('m15Dream')
    .value.trim();

  if(!dream){
    alert('夢を入力してね');
    return;
  }

  if(persist(()=>{

    s.dream=dream;

    s.medium=document
      .getElementById('m15Medium')
      .value.trim();

    s.short=document
      .getElementById('m15Short')
      .value.trim();

    db.goal=dream;

    s.history.push({
      date:date15(),
      type:'goals',
      dream,
      medium:s.medium,
      short:s.short
    });

  })){
    render();
  }
};

window.m15Choose=()=>{
  const selected=[
    ...document.querySelectorAll(
      '.m15-pick:checked'
    )
  ].map(x=>x.value);

  if(selected.length>3){
    alert('約束は3つまで選んでね');
    return;
  }

  if(persist(()=>{
    day().chosen=selected;
  })){
    render();
  }
};

window.m15Check=(id,on)=>{
  if(persist(()=>{

    const d=day();

    if(
      on &&
      !d.checked.includes(id)
    ){
      d.checked.push(id);
    }

    if(!on){
      d.checked=d.checked.filter(
        x=>x!==id
      );
    }

  })){
    render();
  }
};

window.m15SaveReflection=()=>{
  if(persist(()=>{

    day().reflection=document
      .getElementById('m15Reflection')
      .value.trim();

    day().rest=document
      .getElementById('m15Rest')
      .checked;

  })){
    alert(
      '今日の振り返りを保存したよ！'
    );

    render();
  }
};

window.m15Reflect=()=>{
  go('mandala15');
};

if(
  !tabs.some(x=>x[0]==='mandala15')
){
  tabs.push([
    'mandala15',
    '🌟 81マス目標'
  ]);
}

const previousRender=render;

render=function(){

  if(tab==='mandala15'){

    const requested=tab;

    tab='home';

    try{
      previousRender.call(this);
    }finally{
      tab=requested;
    }

    const v=document.getElementById(
      'view'
    );

    if(v){
      v.innerHTML=screen();
    }

    const nav=document.getElementById(
      'nav'
    );

    if(
      nav &&
      !nav.querySelector(
        '[onclick*=mandala15]'
      )
    ){
      nav.insertAdjacentHTML(
        'beforeend',
        `
          <button
            class="active"
            onclick="go('mandala15')"
          >
            🌟 81マス目標
          </button>
        `
      );
    }

    return;
  }

  previousRender.call(this);

  if(tab==='home'){

    const v=document.getElementById(
      'view'
    );

    if(
      v &&
      !v.querySelector('.m15-home')
    ){
      v.insertAdjacentHTML(
        'afterbegin',
        todayPanel()
      );
    }
  }
};

render();

})();
</script>

(function(){
"use strict";

/*
 81マスの9ブロックを
 テーマごとに色分けする。

 既存の目標・保存データは変更しない。
*/

const M16_COLORS=[
  ["#e0efff","#2468b1"], // バッティング：青
  ["#e1f4e7","#27834d"], // 守備：緑
  ["#fff0d7","#d78b27"], // 走塁：オレンジ
  ["#f0e6ff","#8652b5"], // 体力づくり：紫
  ["#ffe1e1","#b94545"], // ピッチング：赤
  ["#e0f6f4","#278b88"], // 人間性：青緑
  ["#fff7cf","#a78621"], // 勉強：黄色
  ["#fce5f2","#ad4d88"]  // 食事：ピンク
];

/*
 第15弾の配置に合わせた
 3×3ブロックのテーマ番号。

 中央のブロックは
 8テーマ＋夢の構成。
*/

function m16ThemeIndex(index){

  const row=Math.floor(index/9);
  const col=index%9;

  const blockRow=Math.floor(row/3);
  const blockCol=Math.floor(col/3);

  const group=blockRow*3+blockCol;

  if(group===4){

    const innerRow=row%3;
    const innerCol=col%3;
    const inner=innerRow*3+innerCol;

    if(inner===4)return -1;

    return inner<4?inner:inner-1;
  }

  return group<4?group:group-1;
}

function m16Apply(){

  const grid=document.querySelector(
    ".m15-grid"
  );

  if(!grid)return;

  const cells=grid.querySelectorAll(
    ".m15-cell"
  );

  cells.forEach((cell,index)=>{

    const theme=m16ThemeIndex(index);

    if(theme<0)return;

    const colors=M16_COLORS[theme];

    if(!colors)return;

    cell.style.setProperty(
      "--cell-light",
      colors[0]
    );

    cell.style.setProperty(
      "--cell-dark",
      colors[1]
    );

    // 各ブロックの所属を明確化
    cell.dataset.theme=String(theme);

  });

}

/*
 第15弾の描画後に色分けする。
*/

const m16PreviousRender=render;

render=function(){

  m16PreviousRender.apply(this,arguments);

  if(tab==="mandala15"){
    m16Apply();
  }

};

render();

})();
</script>

<!-- ===== 第17弾①：練習XP再計算エンジン ===== -->
<script>
(function(){
'use strict';

if(
  typeof db==='undefined' ||
  typeof save!=='function'
){
  console.warn('第17弾：既存データに接続できません');
  return;
}

const V17='v17-xp-1';

/*
 既存の記録は変更しない。
 このコードの読み込み後に新しく追加された
 練習記録だけを処理する。
*/
const existing=new WeakSet();

(db.practice||[]).forEach(e=>{
  if(e&&typeof e==='object'){
    existing.add(e);
  }
});

/*
 メニュー別の基準。
 base: 基準量でのXP
 standard: 基準量
 unit: 分・回など

 これはゲーム用の暫定配点であり、
 医学的な能力向上量を表すものではない。
*/
const RULES=[
  {
    words:['素振り'],
    base:12,
    standard:30
  },
  {
    words:['ノック','守備練習'],
    base:15,
    standard:30
  },
  {
    words:['キャッチボール'],
    base:12,
    standard:20
  },
  {
    words:['ティー','バッティング'],
    base:14,
    standard:30
  },
  {
    words:['ラダー','走塁','ダッシュ'],
    base:12,
    standard:20
  },
  {
    words:['シャドーピッチング'],
    base:12,
    standard:20
  },
  {
    words:['ストレッチ','身体ケア'],
    base:8,
    standard:15
  },
  {
    words:['野球ノート','配球研究'],
    base:8,
    standard:20
  }
];

function number17(value,fallback=0){
  const n=Number(value);
  return Number.isFinite(n)?n:fallback;
}

function clamp17(n,min,max){
  return Math.max(min,Math.min(max,n));
}

function rule17(entry){
  const name=String(entry.name||'');
  const kind=String(entry.kind||'');

  return RULES.find(r=>
    r.words.some(w=>
      name.includes(w)||kind.includes(w)
    )
  )||null;
}

function isRest17(entry){
  return /睡眠|休養|休息|オフ/.test(
    String(entry.name||'')+' '+
    String(entry.kind||'')
  );
}

function isCare17(entry){
  return /身体ケア|ストレッチ|回復/.test(
    String(entry.name||'')+' '+
    String(entry.kind||'')
  );
}

function calculate17(entry){
  if(isRest17(entry)){
    return 0;
  }

  const rule=rule17(entry);

  /*
   未登録メニューは従来の基本XPを使う。
   既存メニューとの互換性を優先する。
  */
  if(!rule){
    return clamp17(
      number17(entry.xp,5),
      0,
      15
    );
  }

  const amount=number17(entry.amount,0);

  /*
   数量が入力されていない場合は
   基準量とみなさず、基本XPの半分。
  */
  if(amount<=0){
    return Math.round(rule.base*0.5);
  }

  /*
   練習量の平方根を使い、
   長時間練習のXP効率を抑える。
  */
  const ratio=amount/rule.standard;

  let xp=rule.base*Math.sqrt(ratio);

  /*
   1記録あたりのXP上限。
   ケアは長時間化を促さない。
  */
  const max=isCare17(entry)?12:28;

  return clamp17(
    Math.round(xp),
    1,
    max
  );
}

function dailyTotal17(date,exclude){
  return (db.practice||[])
    .filter(e=>
      e!==exclude &&
      e.date===date &&
      !isRest17(e)
    )
    .reduce(
      (sum,e)=>sum+Math.max(
        0,
        number17(e.xp)
      ),
      0
    );
}

function adjust17(entry){
  if(
    !entry ||
    typeof entry!=='object' ||
    existing.has(entry) ||
    entry.xpEngine===V17
  ){
    return;
  }

  const oldXP=number17(entry.xp);
  const calculated=calculate17(entry);

  /*
   1日の練習XP上限は60。
   休養や身体ケアの記録自体は
   XPがなくても残す。
  */
  const already=dailyTotal17(
    entry.date,
    entry
  );

  const allowed=Math.max(0,60-already);

  const finalXP=isRest17(entry)
    ?0
    :Math.min(calculated,allowed);

  /*
   既存の追加処理が先に加算したXPと
   新しい計算結果との差だけを補正する。
  */
  db.xp=Math.max(
    0,
    number17(db.xp)+finalXP-oldXP
  );

  entry.xp=finalXP;
  entry.xpEngine=V17;
  entry.xpCalculated=calculated;
  entry.xpLimited=finalXP<calculated;
  entry.xpRule='volume-sqrt';
}

/*
 save() の直前に新規練習記録を補正。

 過去の記録は読み込み時に
 WeakSetへ登録しているため変更しない。
*/
const previousSave17=save;

save=function(){
  const pending=(db.practice||[])
    .filter(e=>
      e &&
      typeof e==='object' &&
      !existing.has(e) &&
      e.xpEngine!==V17
    );

  const originalXP=number17(db.xp);

  const snapshots=pending.map(e=>({
    entry:e,
    xp:e.xp,
    xpEngine:e.xpEngine,
    xpCalculated:e.xpCalculated,
    xpLimited:e.xpLimited,
    xpRule:e.xpRule
  }));

  try{
    pending.forEach(adjust17);

    const result=previousSave17.apply(
      this,
      arguments
    );

    if(result===false){
      throw new Error('保存失敗');
    }

    pending.forEach(e=>existing.add(e));

    return result;

  }catch(error){
    db.xp=originalXP;

    snapshots.forEach(s=>{
      s.entry.xp=s.xp;

      for(const key of [
        'xpEngine',
        'xpCalculated',
        'xpLimited',
        'xpRule'
      ]){
        if(s[key]===undefined){
          delete s.entry[key];
        }else{
          s.entry[key]=s[key];
        }
      }
    });

    console.error(
      '第17弾：XP保存処理に失敗',
      error
    );

    return false;
  }
};

/*
 動作確認用。
 コンソールから呼び出せる。
*/
window.v17CalculateXP=calculate17;

console.log(
  '第17弾①：練習XP計算エンジンを読み込みました'
);

})();
</script>
<!-- ===== 第17弾① 終了 ===== -->

<script>
(function(){
'use strict';

const KEY='shunsuke_evaluation_v172';

const ABILITIES=[
  'ミート',
  'パワー',
  '走力',
  '肩力',
  '守備力',
  '捕球',
  '球威',
  '制球力',
  'スタミナ',
  '投球術'
];

const RANKS=['G','F','E','D','C','B','A'];

function escapeHTML(v){
  return String(v??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function localDate(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return [
    d.getFullYear(),
    p(d.getMonth()+1),
    p(d.getDate())
  ].join('-');
}

function fresh(){
  return {
    version:1,
    school:'elementary',
    evaluations:[],
    conditions:[],
    notes:[]
  };
}

function readData(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(!x||typeof x!=='object')return fresh();
    return {
      ...fresh(),
      ...x,
      evaluations:Array.isArray(x.evaluations)
        ?x.evaluations:[],
      conditions:Array.isArray(x.conditions)
        ?x.conditions:[],
      notes:Array.isArray(x.notes)
        ?x.notes:[]
    };
  }catch(e){
    return fresh();
  }
}

let state=readData();

function persist(){
  try{
    localStorage.setItem(
      KEY,
      JSON.stringify(state)
    );
    return true;
  }catch(e){
    alert('保存できませんでした。容量を確認してください。');
    return false;
  }
}

/*
 評価ランクは測定者が登録する。
 自動的に能力が上がったと断定しない。

 進学時は3ランク下の表示基準とする。
 実際の測定値・評価履歴は変更しない。
*/
function schoolPenalty(){
  if(state.school==='middle')return 3;
  if(state.school==='high')return 6;
  return 0;
}

function latestEvaluation(name){
  return [...state.evaluations]
    .filter(x=>x.ability===name)
    .sort((a,b)=>
      String(a.date).localeCompare(String(b.date))
    )
    .at(-1)||null;
}

function displayedRank(x){
  if(!x)return '未評価';

  const original=RANKS.indexOf(x.rank);
  if(original<0)return '未評価';

  /*
   入力されたランクは小学生基準の
   比較用ランクとして保持する。

   中学・高校での実力を科学的に
   推定するものではない。
  */
  return RANKS[
    Math.max(0,original-schoolPenalty())
  ];
}

function abilityCards(){
  return ABILITIES.map(name=>{
    const x=latestEvaluation(name);
    const rank=displayedRank(x);

    return `
      <div class="v172-card">
        <div class="v172-row">
          <strong>${escapeHTML(name)}</strong>
          <span class="v172-rank">
            ${escapeHTML(rank)}
          </span>
        </div>

        ${
          x
          ?`
            <p class="v172-muted">
              最終評価：${escapeHTML(x.date)}
              ／基準評価 ${escapeHTML(x.rank)}
            </p>
            <p>${escapeHTML(x.memo)}</p>
          `
          :`
            <p class="v172-muted">
              まだ評価されていません。
              測定や実戦を通じて記録しましょう。
            </p>
          `
        }
      </div>
    `;
  }).join('');
}

function conditionSummary(){
  const recent=[...state.conditions]
    .sort((a,b)=>
      String(a.date).localeCompare(String(b.date))
    )
    .slice(-7);

  if(!recent.length){
    return '<p>まだ体調記録はありません。</p>';
  }

  const average=key=>{
    const values=recent
      .map(x=>Number(x[key]))
      .filter(Number.isFinite);

    return values.length
      ?(
        values.reduce((a,b)=>a+b,0)/
        values.length
      ).toFixed(1)
      :'—';
  };

  const pain=recent.filter(x=>x.pain!=='none').length;

  return `
    <p>直近${recent.length}回の記録</p>
    <p>😊 楽しさ平均：${average('fun')} / 5</p>
    <p>💪 きつさ平均：${average('effort')} / 5</p>
    <p>🛌 睡眠平均：${average('sleep')} 時間</p>
    <p>🩹 痛みの報告：${pain}回</p>
    <p class="v172-muted">
      この集計は状態の振り返り用です。
      練習の安全性を保証するものではありません。
    </p>
  `;
}

function renderPanel(){

      <button onclick="v172SetSchool()">

      <p class="v172-muted">

      </p>
    </div>

    <div class="v172-card">
      <h3>📈 能力の評価記録</h3>

      <label>能力項目
        <select id="v172Ability">
          ${ABILITIES.map(x=>`
            <option>${escapeHTML(x)}</option>
          `).join('')}
        </select>
      </label>

      <label>基準評価ランク
        <select id="v172Rank">
          ${RANKS.map(x=>`
            <option
              value="${x}"
              ${x==='G'?'selected':''}
            >${x}</option>
          `).join('')}
        </select>
      </label>

      <label>測定・試合で確認したこと
        <textarea id="v172Memo"
          placeholder="例：正面のゴロ10球中9球を捕球。送球は8球成功。"
        ></textarea>
      </label>

      <button onclick="v172SaveEvaluation()">
        📊 評価を記録
      </button>

      <p class="v172-muted">
        ランクは現時点では保護者・指導者の
        暫定評価です。実測データが蓄積するまで、
        全国水準との比較とは扱いません。
      </p>
    </div>

    <h3>🏅 現在の能力評価</h3>
    ${abilityCards()}

    <div class="v172-card">
      <h3>❤️ 今日のコンディション</h3>

        <select id="v172Effort">

window.v172SetSchool=function(){
  const next=document.getElementById(
    'v172School'
  ).value;

  if(!['elementary','middle','high'].includes(next)){
    return;
  }

  if(!confirm(
    '評価ステージを変更しますか？\n' +
    '過去の評価記録は変更されません。'
  ))return;

  const previous=state.school;
  state.school=next;

  if(!persist()){
    state.school=previous;
    return;
  }

  renderPanel();
};

window.v172SaveEvaluation=function(){
  const ability=document.getElementById(

  ).value;

  const rank=document.getElementById(

<script>
(function(){
'use strict';

const KEY='shunsuke_measurements_v173';
const RANKS=['G','F','E','D','C','B','A'];

const TESTS={
  fielding:{
    label:'守備・捕球成功率',
    unit:'%',
    direction:'higher',
    min:0,
    max:100
  },
  throwing:{
    label:'送球成功率',
    unit:'%',
    direction:'higher',
    min:0,
    max:100
  },
  hitting:{
    label:'打撃コンタクト率',
    unit:'%',
    direction:'higher',
    min:0,
    max:100
  },
  sprint:{
    label:'30m走タイム',
    unit:'秒',
    direction:'lower',
    min:3,
    max:20
  },
  velocity:{
    label:'球速',
    unit:'km/h',
    direction:'higher',
    min:20,
    max:180
  }
};

function initial(){
  return {
    version:1,
    school:'elementary',
    stageRanks:{
      elementary:{},
      middle:{},
      high:{}
    },
    measurements:[]
  };
}

function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(!raw||typeof raw!=='object'){
      return initial();
    }
    const base=initial();
    return {
      ...base,
      ...raw,
      stageRanks:{
        ...base.stageRanks,
        ...(raw.stageRanks||{})
      },
      measurements:Array.isArray(raw.measurements)
        ?raw.measurements:[]
    };
  }catch(e){
    return initial();
  }
}

let data=load();

function saveData(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data));
    return true;
  }catch(e){
    alert('保存に失敗しました。');
    return false;
  }
}

function esc(v){
  return String(v??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function today(){
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return [
    d.getFullYear(),
    pad(d.getMonth()+1),
    pad(d.getDate())
  ].join('-');
}

function recordsOf(test){
  return data.measurements
    .filter(x=>x.test===test)
    .sort((a,b)=>
      String(a.date).localeCompare(String(b.date))||
      String(a.createdAt).localeCompare(String(b.createdAt))
    );
}

function average(values){
  if(!values.length)return null;
  return values.reduce((a,b)=>a+b,0)/values.length;
}

function analysis(test){
  const records=recordsOf(test);
  const config=TESTS[test];

  if(!records.length)return null;

  const values=records.map(x=>x.value);
  const first=values[0];
  const latest=values.at(-1);
  const recent=average(values.slice(-3));

  /*
    変化率は参考情報。
    測定誤差や成熟による変化を
    除外できるわけではない。
  */
  const change=first===0
    ?null
    :(latest-first)/Math.abs(first)*100;

  const improved=change===null
    ?null
    :(config.direction==='higher'
      ?change
      :-change);

  const reliability=
    records.length>=6?'記録数：十分':
    records.length>=3?'記録数：増加中':
    '記録数：少ない';

  return {
    count:records.length,
    first,
    latest,
    recent,
    improved,
    reliability,
    lastDate:records.at(-1).date
  };
}

/*
 学校段階別のゲーム評価。
 測定値からA〜Gを自動確定しない。

 進学時は直前の学校段階で登録した
 ランクを3段階下げて初期値にする。
 以後は新しい学校段階で独立して
 評価を更新できる。
*/
function stageRank(test,school){
  const own=data.stageRanks[school]||{};

  if(RANKS.includes(own[test])){
    return own[test];
  }

  if(school==='elementary'){
    return '未評価';
  }

  const previous=school==='middle'
    ?'elementary'
    :'middle';

  const prior=stageRank(test,previous);

  if(!RANKS.includes(prior)){
    return '未評価';
  }

  return RANKS[
    Math.max(0,RANKS.indexOf(prior)-3)
  ];
}

function cards(){
  return Object.entries(TESTS).map(([id,t])=>{
    const a=analysis(id);
    const rank=stageRank(id,data.school);

    return `
      <div class="card">
        <div class="row">
          <strong>${esc(t.label)}</strong>
          <span class="rank">${esc(rank)}</span>
        </div>

        ${a?`
          <p>
            初回：${a.first.toFixed(2)} ${esc(t.unit)}
          </p>
          <p>
            最新：${a.latest.toFixed(2)} ${esc(t.unit)}
          </p>
          <p>
            直近3回平均：
            ${a.recent.toFixed(2)} ${esc(t.unit)}
          </p>
          <p>
            初回比：
            ${a.improved===null?'—':
              (a.improved>=0?'+':'')+
              a.improved.toFixed(1)+'%'}
            （改善方向を正として表示）
          </p>
          <p class="muted">
            ${esc(a.reliability)}
            ／記録${a.count}回
            ／最終${esc(a.lastDate)}
          </p>
        `:`
          <p class="muted">
            測定記録はまだありません。
          </p>
        `}

        <p class="muted">
          ランクはゲーム上の暫定評価です。
          測定値だけから全国水準を
          判定していません。
        </p>
      </div>
    `;
  }).join('');
}

function render(){
  const schoolLabels={
    elementary:'小学生',
    middle:'中学生',
    high:'高校生'
  };

  document.getElementById('v173-panel').innerHTML=`
    <div class="row">
      <h2>⚾ 実力測定・成長分析</h2>
      <button onclick="v173Close()">閉じる</button>
    </div>

    <div class="card">
      <h3>🎓 評価ステージ</h3>
      <p><strong>
        ${schoolLabels[data.school]}
      </strong></p>

      <p class="muted">
        進学時は前段階のランクから
        3ランク下げて開始します。
        測定履歴は引き継ぎます。
      </p>

      <button onclick="v173Advance()">
        次の学校段階へ進む
      </button>
    </div>

    <div class="card">
      <h3>📏 新しい測定を記録</h3>

      <label>測定項目
        <select id="v173-test">
          ${Object.entries(TESTS).map(([id,t])=>`
            <option value="${id}">
              ${esc(t.label)}（${esc(t.unit)}）
            </option>
          `).join('')}
        </select>
      </label>

      <label>測定値
        <input
          id="v173-value"
          type="number"
          step="any"
          placeholder="測定した数値"
        >
      </label>

      <label>測定日
        <input
          id="v173-date"
          type="date"
          value="${today()}"
        >
      </label>

      <label>測定条件・メモ
        <input
          id="v173-note"
          type="text"
          maxlength="300"
          placeholder="例：正面のゴロ20球、同じ距離"
        >
      </label>

      <button onclick="v173Add()">
        💾 測定結果を保存
      </button>

      <p class="muted">
        成功率は成功数÷試行数×100で入力。
        できるだけ同じ条件で測定してください。
      </p>
    </div>

    <div class="card">
      <h3>🏅 ゲーム内評価ランク</h3>

      <label>評価項目
        <select id="v173-rank-test">
          ${Object.entries(TESTS).map(([id,t])=>`
            <option value="${id}">
              ${esc(t.label)}
            </option>
          `).join('')}
        </select>
      </label>

      <label>今回の評価
        <select id="v173-rank">
          ${RANKS.map(r=>`
            <option value="${r}">${r}</option>
          `).join('')}
        </select>
      </label>

      <button onclick="v173SetRank()">
        評価を更新
      </button>

      <p class="muted">
        測定結果を確認した保護者・指導者が
        暫定評価を入力する機能です。
        自動昇格ではありません。
      </p>
    </div>

    <h3>📈 成長分析</h3>
    ${cards()}

    <div class="card">
      <h3>🔒 データの取り扱い</h3>
      <p class="muted">
        測定結果はこの端末に保存されます。
        既存のXP・練習履歴・能力値は
        変更しません。
        別端末とは自動同期されません。
      </p>
    </div>
  `;
}

window.v173Open=function(){
  data=load();
  render();
  document.getElementById('v173-overlay')
    .classList.add('active');
};

window.v173Close=function(){
  document.getElementById('v173-overlay')
    .classList.remove('active');
};

window.v173Add=function(){
  const test=document.getElementById(
    'v173-test'
  ).value;

  const input=document.getElementById(
    'v173-value'
  );

  const value=Number(input.value);

  const date=document.getElementById(
    'v173-date'
  ).value;

  const note=document.getElementById(
    'v173-note'
  ).value.trim();

  const config=TESTS[test];

  if(
    !config ||
    !input.value.trim() ||
    !Number.isFinite(value) ||
    value<config.min ||
    value>config.max
  ){
    alert('測定項目と数値を確認してください。');
    return;
  }

  if(
    !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
    date>today()
  ){
    alert('測定日を確認してください。');
    return;
  }

  if(!note){
    alert('測定条件を記録してください。');
    return;
  }

  const record={
    test,
    value,
    date,
    note,
    createdAt:new Date().toISOString()
  };

  data.measurements.push(record);

  if(!saveData()){
    data.measurements.pop();
    return;
  }

  render();
  alert('測定結果を保存しました！');
};

window.v173SetRank=function(){
  const test=document.getElementById(
    'v173-rank-test'
  ).value;

  const rank=document.getElementById(
    'v173-rank'
  ).value;

  if(!TESTS[test]||!RANKS.includes(rank)){
    return;
  }

  if(!analysis(test)){
    alert('先に測定結果を登録してください。');
    return;
  }

  if(!confirm(
    '測定結果や実戦内容を確認して、' +
    '評価ランクを更新しますか？'
  ))return;

  const stage=data.stageRanks[data.school]||{};
  const old=stage[test];

  stage[test]=rank;
  data.stageRanks[data.school]=stage;

  if(!saveData()){
    if(old===undefined)delete stage[test];
    else stage[test]=old;
    return;
  }

  render();
};

window.v173Advance=function(){
  const next={
    elementary:'middle',
    middle:'high'
  }[data.school];

  if(!next){
    alert('現在は高校生ステージです。');
    return;
  }

  if(!confirm(
    '次の学校段階に進みますか？\n' +
    'ランクの基準が3段階上がります。\n' +
    '過去の測定記録は残ります。'
  ))return;

  const old=data.school;
  data.school=next;

  if(!saveData()){
    data.school=old;
    return;
  }

  render();
};

document.getElementById('v173-open')
  .addEventListener('click',window.v173Open);

})();
</script>

<script>
(function(){
'use strict';

const EVAL_KEY='shunsuke_evaluation_v172';
const MEASURE_KEY='shunsuke_measurements_v173';

const ABILITIES=[
  'ミート','パワー','走力','肩力','守備力',
  '捕球','球威','制球力','スタミナ','投球術'
];

const TESTS={
  fielding:['守備・捕球成功率','%'],
  throwing:['送球成功率','%'],
  hitting:['打撃コンタクト率','%'],
  sprint:['30m走','秒'],
  velocity:['球速','km/h']
};

const STAGES={
  elementary:'小学生',
  middle:'中学生',
  high:'高校生'
};

const RANKS=['G','F','E','D','C','B','A'];

function esc174(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;',
    '"':'&quot;',"'":'&#39;'
  }[c]));
}

function read174(key){
  try{
    const value=JSON.parse(localStorage.getItem(key));
    return value&&typeof value==='object'?value:{};
  }catch(e){
    return {};
  }
}

function n174(v,fallback=0){
  const n=Number(v);
  return Number.isFinite(n)?n:fallback;
}

function arr174(v){
  return Array.isArray(v)?v:[];
}

function date174(){
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function last174(items){
  return [...items].sort((a,b)=>
    String(a.recordedAt||a.createdAt||a.date||'')
    .localeCompare(
      String(b.recordedAt||b.createdAt||b.date||'')
    )
  ).at(-1)||null;
}

function rank174(entry,school){
  if(!entry||!RANKS.includes(entry.rank)){
    return '—';
  }
  const penalty={
    elementary:0,middle:3,high:6
  }[school]||0;

  return RANKS[
    Math.max(0,RANKS.indexOf(entry.rank)-penalty)
  ];
}

function measuredRank174(data,test,stage){
  const stages=data.stageRanks||{};
  const own=stages[stage]||{};

  if(RANKS.includes(own[test]))return own[test];

  const prev={
    middle:'elementary',
    high:'middle'
  }[stage];

  if(!prev)return '—';

  const r=measuredRank174(data,test,prev);
  if(!RANKS.includes(r))return '—';

  return RANKS[
    Math.max(0,RANKS.indexOf(r)-3)
  ];
}

function load174(){
  const main=typeof db!=='undefined'?db:{};
  return {
    main,
    eval:read174(EVAL_KEY),
    measure:read174(MEASURE_KEY)
  };
}

function practiceSummary174(main){
  const all=arr174(main.practice);
  const today=date174();
  const todays=all.filter(x=>x.date===today);

  const earned=todays.reduce(
    (sum,x)=>sum+Math.max(0,n174(x.xp)),0
  );

  const total=all.reduce(
    (sum,x)=>sum+Math.max(0,n174(x.xp)),0
  );

  const recent=[...all].reverse().slice(0,5);

  return `
    <div class="stats">
      <div class="stat">
        <span>累計XP</span>
        <span class="value">${n174(main.xp)}</span>

function condition174(e){
  const records=arr174(e.conditions);
  const latest=last174(records);

  if(!latest){

  const sleep=n174(latest.sleep);
  const effort=n174(latest.effort);
  const pain=latest.pain||'none';

  const alerts=[];

  if(pain!=='none'){
    alerts.push(
      '痛みが報告されています。運動を無理に続けず、保護者・指導者に相談してください。'

    alerts.push(
      '睡眠が9時間未満です。小学生の睡眠目安は一般に9〜12時間です。'
    );

  if(effort>=5){

      '練習のきつさが最大評価です。疲労や回復状況を確認しましょう。'
    );

  return `

      ?'<p>今回の入力値に基づく注意表示はありません。</p>'
      :''
    }

    <p class="muted">

      過去の腰のけがなどについては医療者の指示を優先してください。
    </p>
  `;
}

function integrity174(data){
  const warnings=[];

  const a=data.eval.school;
  const b=data.measure.school;

  if(a&&b&&a!==b){
    warnings.push(
      '能力評価と実力測定の学校ステージが一致していません。進学操作を行った画面を確認してください。'

  const practice=arr174(data.main.practice);
  const pending=practice.filter(x=>
    x&&x.xpEngine==='v17-xp-1'&&x.xpLimited

  if(pending.length){
    warnings.push(
      `1日のXP上限が適用された練習記録が${pending.length}件あります。`
    );
  }

  if(!warnings.length){
    return '<p>確認できる範囲で、ステージの不一致はありません。</p>';
  }

  return warnings.map(x=>`
    <div class="warning">${esc174(x)}</div>

}

<script>
(function(){
'use strict';

const KEY_EVAL='shunsuke_evaluation_v172';
const KEY_MEASURE='shunsuke_measurements_v173';

const STAGES=[
  'elementary',
  'middle',
  'high'
];

const NAMES={
  elementary:'小学生',
  middle:'中学生',
  high:'高校生'
};

function read175(key){
  try{
    const x=JSON.parse(localStorage.getItem(key));
    return x&&typeof x==='object'?x:null;
  }catch(e){
    return null;
  }
}

function valid175(stage){
  return STAGES.includes(stage);
}

function escape175(value){
  return String(value??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function current175(){
  const e=read175(KEY_EVAL);
  const m=read175(KEY_MEASURE);

  return {
    eval:e,
    measure:m,
    evalStage:valid175(e?.school)
      ?e.school:null,
    measureStage:valid175(m?.school)
      ?m.school:null
  };
}

function practice175(){
  const main=typeof db!=='undefined'?db:{};
  const records=Array.isArray(main.practice)
    ?main.practice:[];

  const latest=records.at(-1)||null;

  return {
    totalXP:Number(main.xp)||0,
    count:records.length,
    latest
  };
}

/*
 2つの保存領域をまとめて更新する。

 どちらかが保存できなかった場合、
 以前の文字列を使って復元を試みる。

 複数キーの保存は完全な
 トランザクションではないため、
 復元失敗時は警告する。
*/
function saveStage175(next){
  if(!valid175(next))return false;

  const data=current175();

  if(!data.eval||!data.measure){
    alert(
      '第17弾②・③の保存領域を確認できません。'
    );
    return false;
  }

  const oldEval=localStorage.getItem(KEY_EVAL);
  const oldMeasure=localStorage.getItem(KEY_MEASURE);

  const e={
    ...data.eval,
    school:next
  };

  const m={
    ...data.measure,
    school:next
  };

  try{
    localStorage.setItem(
      KEY_EVAL,
      JSON.stringify(e)
    );

    localStorage.setItem(
      KEY_MEASURE,
      JSON.stringify(m)
    );

    return true;

  }catch(error){
    let restored=true;

    try{
      if(oldEval===null){
        localStorage.removeItem(KEY_EVAL);
      }else{
        localStorage.setItem(KEY_EVAL,oldEval);
      }

      if(oldMeasure===null){
        localStorage.removeItem(KEY_MEASURE);
      }else{
        localStorage.setItem(
          KEY_MEASURE,
          oldMeasure
        );
      }

    }catch(restoreError){
      restored=false;
      console.error(
        '復元失敗',
        restoreError
      );
    }

    alert(
      restored
        ?'保存に失敗しました。以前の状態に戻しました。'
        :'保存と復元に失敗しました。バックアップを確認してください。'
    );

    return false;
  }
}

            }

            :''
          }
        `
        :'<p>まだ練習記録がありません。</p>'
      }

      <p class="muted">
        ここには保存済みのXPを表示します。
        練習登録時の従来の通知は変更しません。
      </p>
    </div>

    <div class="card">

      ${

        ?'<p>✅ 両方のステージが一致しています。</p>'

      }

      <label for="v175-stage">
        統一する学校ステージ
      </label>

      <select id="v175-stage">
        ${STAGES.map(s=>`
          <option
            value="${s}"
            ${
              s===(data.evalStage||'elementary')
              ?'selected':''
            }
          >
            ${NAMES[s]}
          </option>
        `).join('')}
      </select>

      <button
        onclick="v175SaveStage()"
        ${!data.eval||!data.measure?'disabled':''}

      </button>

      <p class="muted">
        ステージ統一では、学校ステージの
        設定だけを更新します。

window.v175SaveStage=function(){

    'v175-stage'

  if(!valid175(next))return;

  const data=current175();

  const previous=[
    data.evalStage,
    data.measureStage

  const isBackward=previous.some(
    s=>valid175(s)&&
    STAGES.indexOf(next)<STAGES.indexOf(s)

  if(isBackward){
    alert(
      '以前の学校段階には戻せません。' +
      '設定を確認してください。'

  if(!confirm(

    '既存の記録は保持されます。'

  if(saveStage175(next)){

};

practices176().forEach(e=>{
  if(e&&typeof e==='object'){
    known176.add(e);
  }
});

let sequence176=0;

function id176(){
  sequence176++;

  if(
    typeof crypto!=='undefined' &&
    typeof crypto.randomUUID==='function'
  ){
    return crypto.randomUUID();
  }

  return [
    'p176',
    Date.now(),
    sequence176,
    Math.random().toString(36).slice(2)
  ].join('-');
}

/*
 第17弾①で確定済みのXPを尊重する。

 ここでは再計算・再加算を行わない。
*/
function mark176(entry){
  if(
    !entry ||
    typeof entry!=='object' ||
    known176.has(entry)
  ){
    return;
  }

  if(!entry.recordId){
    entry.recordId=id176();
  }

  entry.xpFinalized=VERSION;
}

/*
 保存処理を包み、成功時だけ
 新規記録を処理済みにする。
*/
const previousSave176=save;

save=function(){
  const pending=practices176()
    .filter(e=>
      e &&
      typeof e==='object' &&
      !known176.has(e)
    );

  const snapshots=pending.map(e=>({
    entry:e,
    recordId:e.recordId,
    xpFinalized:e.xpFinalized
  }));

  pending.forEach(mark176);

  let result;

  try{
    result=previousSave176.apply(
      this,
      arguments
    );

    if(result===false){
      throw new Error('保存失敗');
    }

    pending.forEach(e=>known176.add(e));

    return result;

  }catch(error){
    snapshots.forEach(s=>{
      if(s.recordId===undefined){
        delete s.entry.recordId;
      }else{
        s.entry.recordId=s.recordId;
      }

      if(s.xpFinalized===undefined){
        delete s.entry.xpFinalized;
      }else{
        s.entry.xpFinalized=s.xpFinalized;
      }
    });

    console.error(
      '第17弾⑥：保存に失敗しました',
      error
    );

    return false;
  }
};

function daily176(date){
  const records=practices176()
    .filter(e=>e.date===date);

  const total=records.reduce(
    (sum,e)=>sum+Math.max(
      0,num176(e.xp)
    ),
    0
  );

  return {
    records,
    total,
    remaining:Math.max(
      0,
      DAILY_LIMIT-total
    )
  };
}

function report176(){
  const dates=[
    ...new Set(
      practices176()
        .map(e=>e.date)
        .filter(Boolean)
    )
  ].sort().reverse().slice(0,14);

  return dates.map(date=>{
    const day=daily176(date);

    return `
      <div class="card">
        <strong>${esc176(date)}</strong>

        <p>
          練習記録：${day.records.length}件
        </p>

        <p>
          練習XP合計：
          <b>${day.total} XP</b>
        </p>

        ${
          day.total>DAILY_LIMIT
          ?`
            <p style="color:#b35b18">
              ⚠️ この日の記録XPは
              現在の上限を超えています。
              過去データは変更しません。
            </p>
          `
          :''
        }
      </div>
    `;
  }).join('')||
    '<p>まだ練習記録がありません。</p>';
}

<script>
(function(){
'use strict';

const KEY='shunsuke_daily_missions_v179';

const MISSIONS=[
  {
    id:'sleep',
    title:'😴 睡眠を記録',
    desc:'睡眠時間を確認し、回復を大切にする'
  },
  {
    id:'meal',
    title:'🍚 食事を記録',
    desc:'朝・昼・夜の食事を振り返る'
  },
  {
    id:'activity',
    title:'⚾ 練習または休養を記録',
    desc:'練習日も休養日も達成できる'
  },
  {
    id:'condition',
    title:'❤️ 身体の状態を確認',
    desc:'疲労や痛みの有無を確認する'
  },
  {
    id:'reflection',
    title:'🌟 今日の振り返り',
    desc:'よかったことや学んだことを残す'
  }
];

function today179(){
  const d=new Date();
  const p=x=>String(x).padStart(2,'0');
  return [
    d.getFullYear(),
    p(d.getMonth()+1),
    p(d.getDate())
  ].join('-');
}

function esc179(v){
  return String(v??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;',
      '"':'&quot;',"'":'&#39;'
    }[c])
  );
}

function load179(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    return x&&typeof x==='object'&&!Array.isArray(x)
      ?x:{};
  }catch(e){
    return {};
  }
}

let store179=load179();

function save179(){
  try{
    localStorage.setItem(KEY,JSON.stringify(store179));
    return true;
  }catch(e){
    console.error('ミッション保存失敗',e);
    alert('保存できませんでした。端末の保存容量などを確認してください。');
    return false;
  }
}

function entry179(date){
  const x=store179[date];
  return x&&typeof x==='object'?x:{};
}

function complete179(entry){
  return MISSIONS.filter(m=>entry[m.id]===true).length;
}

function streak179(){
  let days=0;
  const d=new Date();
  d.setHours(12,0,0,0);

  const today=today179();
  if(complete179(entry179(today))!==5){
    d.setDate(d.getDate()-1);
  }

  for(let i=0;i<365;i++){
    const p=x=>String(x).padStart(2,'0');
    const key=[
      d.getFullYear(),
      p(d.getMonth()+1),
      p(d.getDate())
    ].join('-');

    if(complete179(entry179(key))!==5)break;

    days++;
    d.setDate(d.getDate()-1);
  }

  return days;
}

function render179(){
  const date=today179();
  const entry=entry179(date);
  const count=complete179(entry);
  const percent=Math.round(count/5*100);

  const app=document.getElementById('v179-app');
  if(!app)return;

  app.innerHTML=`
    <div class="hero">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
        <div>
          <small>SHUNSUKE DAILY SUCCESS</small>
          <h2>🎯 今日の育成ミッション</h2>
        </div>
        <button type="button" id="v179-close">
          ✕
        </button>
      </div>

      <p>${esc179(date)}</p>

      <div class="stats">
        <div class="stat">
          <small>達成数</small>
          <strong>${count}/5</strong>
        </div>
        <div class="stat">
          <small>達成率</small>
          <strong>${percent}%</strong>
        </div>
        <div class="stat">
          <small>連続達成</small>
          <strong>${streak179()}日</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>今日の進捗</h3>
      <div class="bar">
        <div class="fill" style="width:${percent}%"></div>
      </div>
      <p class="muted">
        ${count===5
          ?'🏆 今日のミッションコンプリート！'
          :'できることから一つずつ達成しよう！'}
      </p>
    </div>

    <div class="card">
      <h3>📋 5つのミッション</h3>
      ${MISSIONS.map(m=>`
        <label class="mission">
          <input
            type="checkbox"
            data-mission="${m.id}"
            ${entry[m.id]===true?'checked':''}
          >
          <span>
            <strong>${m.title}</strong>
            <span class="muted" style="display:block">
              ${m.desc}
            </span>
          </span>
        </label>
      `).join('')}
    </div>

    <div class="card">
      <h3>✏️ 今日のひとこと</h3>
      <textarea id="v179-note"
        placeholder="今日できたこと、楽しかったこと、明日意識したいこと">${esc179(entry.note||'')}</textarea>
      <button type="button" id="v179-save-note">
        💾 振り返りを保存
      </button>
      <p class="muted">
        振り返りを保存してもチェックは自動では入りません。
        内容を確認してチェックしてください。
      </p>
    </div>

    <div class="card">
      <h3>🔗 既存の記録画面</h3>
      <button type="button" id="v179-open-base">
        ⚾ 育成基地を開く
      </button>
      <button type="button" id="v179-open-condition">
        ❤️ コンディション評価
      </button>
      <p class="muted">
        チェック項目は自己申告で管理します。
        既存の睡眠・食事・練習記録との自動照合は
        まだ行っていません。
      </p>
    </div>

    <div class="card">
      <h3>💚 休養日も100%達成できる</h3>
      <p>
        休むことも大切なトレーニング。
        痛みや強い疲労があるときは
        無理をせず身体の回復を優先しよう。
      </p>
      <p class="muted">
        この機能はXPを加算しません。
        既存の練習記録や能力評価は変更しません。
      </p>
    </div>
  `;

  app.querySelector('#v179-close')
    .addEventListener('click',window.v179Close);

  app.querySelectorAll('[data-mission]')
    .forEach(input=>{
      input.addEventListener('change',()=>{
        const id=input.dataset.mission;
        const next={
          ...entry179(today179()),
          [id]:input.checked
        };

        const previous=store179[today179()];
        store179[today179()]=next;

        if(!save179()){
          if(previous===undefined){
            delete store179[today179()];
          }else{
            store179[today179()]=previous;
          }
        }

        render179();
      });
    });

  app.querySelector('#v179-save-note')
    .addEventListener('click',()=>{
      const note=app.querySelector('#v179-note').value;
      const date=today179();
      const previous=store179[date];

      store179[date]={
        ...entry179(date),
        note
      };

      if(save179()){
        alert('今日の振り返りを保存しました。');
      }else{
        if(previous===undefined){
          delete store179[date];
        }else{
          store179[date]=previous;
        }
      }
    });

  app.querySelector('#v179-open-base')
    .addEventListener('click',()=>{
      window.v179Close();
      if(typeof window.v177Open==='function'){
        window.v177Open();
      }
    });

  app.querySelector('#v179-open-condition')
    .addEventListener('click',()=>{
      window.v179Close();
      if(typeof window.v172Open==='function'){
        window.v172Open();
      }
    });
}

window.v179Open=function(){
  store179=load179();
  render179();
  document.getElementById('v179-overlay')
    .classList.add('open');
};

window.v179Close=function(){
  document.getElementById('v179-overlay')
    .classList.remove('open');
};

document.getElementById('v179-open')
  .addEventListener('click',window.v179Open);

})();
</script>

<script>
(function(){
'use strict';

const DAILY_KEY='shunsuke_daily_missions_v179';
const EVAL_KEY='shunsuke_evaluation_v172';

const MISSION_LIST=[
  ['sleep','😴 睡眠'],
  ['meal','🍚 食事'],
  ['activity','⚾ 練習・休養'],
  ['condition','❤️ 体調確認'],
  ['reflection','🌟 振り返り']
];

function today1710(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  return [
    d.getFullYear(),
    p(d.getMonth()+1),
    p(d.getDate())
  ].join('-');
}

function read1710(key){
  try{
    const data=JSON.parse(localStorage.getItem(key));
    return data &&
      typeof data==='object' &&
      !Array.isArray(data)
      ?data:{};
  }catch(e){
    return {};
  }
}

function array1710(x){
  return Array.isArray(x)?x:[];
}

function sameDay1710(item,date){
  return item &&
    typeof item.date==='string' &&
    item.date.slice(0,10)===date;
}

function hasToday1710(items,date){
  return array1710(items).some(
    item=>sameDay1710(item,date)
  );
}

function validSleep1710(item,date){
  if(!sameDay1710(item,date))return false;

  const value=item.hours ?? item.sleep;
  if(value===null ||
     value===undefined ||
     value==='')return false;

  const hours=Number(value);
  return Number.isFinite(hours) &&
    hours>0 &&
    hours<=24;
}

function main1710(){
  try{
    return typeof db!=='undefined' && db
      ?db:{};
  }catch(e){
    return {};
  }
}

function evidence1710(date){
  const main=main1710();
  const success=main.success2027||{};
  const evalData=read1710(EVAL_KEY);

  const sleepRecords=[
    ...array1710(success.sleep),
    ...array1710(main.growth)
  ];

  const sleep=sleepRecords.some(
    item=>validSleep1710(item,date)
  );

  const meal=hasToday1710(
    success.meals,date
  );

  const practices=[
    ...array1710(main.practice),
    ...array1710(success.quick)
  ];

  const practiced=hasToday1710(
    practices,date
  );

  const rest=
    main.success9 &&
    main.success9.days &&
    main.success9.days[date]==='rest';

  const conditions=[
    ...array1710(success.condition),
    ...array1710(evalData.conditions)
  ];

  const condition=hasToday1710(
    conditions,date
  );

  const reviews=[
    ...array1710(success.reviews)
  ];

  const reflection=hasToday1710(
    reviews,date
  );

  return {
    sleep:{
      done:sleep,
      source:sleep
        ?'睡眠記録を確認'
        :'対応する睡眠記録なし'
    },
    meal:{
      done:meal,
      source:meal
        ?'食事記録を確認'
        :'食事記録なし'
    },
    activity:{
      done:!!(practiced||rest),
      source:rest
        ?'休養日の設定を確認'
        :practiced
          ?'練習記録を確認'
          :'練習・休養記録なし'
    },
    condition:{
      done:condition,
      source:condition
        ?'体調記録を確認'
        :'対応する体調記録なし'
    },
    reflection:{
      done:reflection,
      source:reflection
        ?'振り返り記録を確認'
        :'対応する振り返り記録なし'
    }
  };
}

function escape1710(value){
  return String(value??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function combined1710(date){
  const manual=read1710(DAILY_KEY)[date]||{};
  const auto=evidence1710(date);

  const results=MISSION_LIST.map(([id,label])=>{
    const manuallyDone=manual[id]===true;
    const automaticallyDone=auto[id].done;

    return {
      id,
      label,
      done:manuallyDone||automaticallyDone,
      source:automaticallyDone
        ?auto[id].source
        :manuallyDone
          ?'手動チェックで達成'
          :auto[id].source
    };
  });

  return {
    results,
    count:results.filter(x=>x.done).length
  };
}

function render1710(){
  const app=document.getElementById('v179-app');
  if(!app)return;

  const date=today1710();
  const data=combined1710(date);
  const percent=Math.round(
    data.count/5*100
  );

  const html=`
    <h3>🔗 自動連携ミッション</h3>

    <strong style="font-size:23px">
      ${data.count}/5 達成
      （${percent}%）
    </strong>

    <div class="meter">
      <div class="meter-fill"
        style="width:${percent}%">
      </div>
    </div>

    ${data.results.map(x=>`
      <div class="item">
        <strong>
          ${x.done?'✅':'⬜'}
          ${escape1710(x.label)}
        </strong>
        <span class="detail">
          ${escape1710(x.source)}
        </span>
      </div>
    `).join('')}

    <p class="small">
      自動判定は記録の有無を確認します。
      元の5つのチェック欄は手動操作用として
      そのまま残しています。
      自動判定で既存の保存データやXPを
      書き換えることはありません。
    </p>

    <button type="button"
      id="v1710-refresh">
      🔄 記録を再確認
    </button>
  `;

  let panel=document.getElementById(
    'v1710-summary'
  );

  if(!panel){
    panel=document.createElement('section');
    panel.id='v1710-summary';

    const hero=app.querySelector('.hero');

    if(hero){
      hero.insertAdjacentElement(
        'afterend',panel
      );
    }else{
      app.prepend(panel);
    }
  }

  panel.innerHTML=html;

  panel.querySelector('#v1710-refresh')
    .addEventListener('click',render1710);
}

/*
 第17弾⑨の画面を開いた後、
 自動連携結果を追加表示する。
*/
const oldOpen1710=window.v179Open;

if(typeof oldOpen1710!=='function'){
  console.warn(
    '第17弾⑩：第17弾⑨が必要です'
  );
  return;
}

window.v179Open=function(){
  oldOpen1710();
  render1710();
};

/*
 第17弾⑨がチェック変更で画面を
 再描画した場合にも連携欄を更新。
*/
const app1710=document.getElementById(
  'v179-app'
);

if(app1710){
  let updating=false;

  const observer=new MutationObserver(()=>{
    if(updating)return;

    if(
      !document.getElementById(
        'v179-overlay'
      )?.classList.contains('open')
    )return;

    if(
      !document.getElementById(
        'v1710-summary'
      )
    ){
      updating=true;
      try{
        render1710();
      }finally{
        updating=false;
      }
    }
  });

  observer.observe(app1710,{
    childList:true
  });

  /*
   手動チェックの変更後に
   統合達成率を更新する。
  */
  app1710.addEventListener('change',e=>{
    if(!e.target.matches(
      '[data-mission]'
    ))return;

    setTimeout(render1710,0);
  });
}

window.v1710Refresh=render1710;

})();
</script>

  try{
    const x=JSON.parse(localStorage.getItem(key));
    return x&&typeof x==='object'&&!Array.isArray(x)
      ?x:{};
  }catch(e){
    return {};
  }
}

function arr1711(x){
  return Array.isArray(x)?x:[];
}

function esc1711(x){
  return String(x??'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;','<':'&lt;',
      '>':'&gt;','"':'&quot;',
      "'":'&#39;'
    }[c])
  );
}

function dateKey1711(d){
  const p=n=>String(n).padStart(2,'0');
  return [
    d.getFullYear(),
    p(d.getMonth()+1),
    p(d.getDate())
  ].join('-');
}

function parseDate1711(key){
  const match=/^(\d{4})-(\d{2})-(\d{2})$/
    .exec(String(key||''));

  if(!match)return null;

  const d=new Date(
    Number(match[1]),
    Number(match[2])-1,
    Number(match[3]),
    12
  );

  return dateKey1711(d)===key?d:null;
}

function addDays1711(date,days){
  const d=new Date(date);
  d.setDate(d.getDate()+days);
  return d;
}

function monday1711(date){
  const d=new Date(date);
  d.setHours(12,0,0,0);
  d.setDate(
    d.getDate()-(d.getDay()+6)%7
  );
  return d;
}

function main1711(){
  try{
    return typeof db!=='undefined'&&db
      ?db:{};
  }catch(e){
    return {};
  }
}

function onDate1711(x,date){
  return x&&typeof x.date==='string'&&
    x.date.slice(0,10)===date;
}

function has1711(list,date){
  return arr1711(list).some(
    x=>onDate1711(x,date)
  );
}

function sleep1711(list,date){
  return arr1711(list).some(x=>{
    if(!onDate1711(x,date))return false;
    const raw=x.hours??x.sleep;
    if(raw===''||raw==null)return false;
    const n=Number(raw);
    return Number.isFinite(n)&&n>0&&n<=24;
  });
}

function evidence1711(date){
  const main=main1711();
  const s=main.success2027||{};
  const evaluation=read1711(EVAL_KEY);

  const rest=
    main.success9?.days?.[date]==='rest';

  const practice=has1711(
    main.practice,date
  )||has1711(s.quick,date);

  return {
    sleep:sleep1711(
      [
        ...arr1711(s.sleep),
        ...arr1711(main.growth)
      ],date
    ),
    meal:has1711(s.meals,date),
    activity:rest||practice,
    condition:has1711(
      [
        ...arr1711(s.condition),
        ...arr1711(evaluation.conditions)
      ],date
    ),
    reflection:has1711(s.reviews,date),
    rest,
    practice
  };
}

function daily1711(date){
  const manual=read1711(DAILY_KEY)[date]||{};
  const evidence=evidence1711(date);

  const count=MISSION_IDS.filter(
    id=>manual[id]===true||evidence[id]===true
  ).length;

  return {
    date,
    count,
    percent:count*20,
    rest:evidence.rest,
    practice:evidence.practice
  };
}

function week1711(start){
  const main=main1711();
  const s=main.success2027||{};

  const days=Array.from(
    {length:7},
    (_,i)=>daily1711(
      dateKey1711(addDays1711(start,i))
    )
  );

  const startKey=days[0].date;
  const endKey=days[6].date;

  const practiceRows=[
    ...arr1711(main.practice),
    ...arr1711(s.quick)
  ].filter(x=>
    x&&x.date>=startKey&&x.date<=endKey
  );

  const xp=practiceRows.reduce((sum,x)=>{
    const n=Number(x.xp);
    return sum+(
      Number.isFinite(n)&&n>0?n:0
    );
  },0);

  const practicedDays=new Set(
    practiceRows.map(x=>x.date)
  ).size;

  const restDays=days.filter(
    x=>x.rest
  ).length;

  const completed=days.reduce(
    (sum,x)=>sum+x.count,0
  );

  return {
    days,
    completed,
    percent:Math.round(
      completed/35*100
    ),
    practicedDays,
    restDays,
    xp,
    startKey,
    endKey
  };
}

function message1711(w){
  if(w.completed===0){
    return 'まずは1日1項目から記録してみよう。';
  }

  if(w.percent>=80){
    return '毎日の記録をよく続けられたね！';
  }

  if(w.percent>=50){
    return 'コツコツ積み重ねられているね。';
  }

  return '記録できた日を大切にして、少しずつ続けよう。';
}

let offset1711=0;

function render1711(){
  const today=new Date();
  const start=monday1711(today);
  start.setDate(
    start.getDate()+offset1711*7
  );

  const w=week1711(start);
  const previous=week1711(
    addDays1711(start,-7)
  );

  const notes=read1711(NOTE_KEY);
  const savedNote=notes[w.startKey]||'';

  const change=w.completed-previous.completed;

  const app=document.getElementById(
    'v1711-app'
  );

  if(!app)return;

  app.innerHTML=`
    <div class="row">
      <h2>⚾ 週間育成レポート</h2>
      <button id="v1711-close">
        ✕ 閉じる
      </button>
    </div>

    <section class="hero">
      <small>WEEKLY BASEBALL SUCCESS</small>
      <h2>
        ${esc1711(w.startKey)}
        〜 ${esc1711(w.endKey)}
      </h2>

      <div style="font-size:32px;font-weight:900">
        ${w.completed}/35
      </div>

      <p>
        ミッション達成率 ${w.percent}%
      </p>

      <div class="bar">
        <div class="fill"
          style="width:${w.percent}%">
        </div>
      </div>
    </section>

    <div class="row">
      <button id="v1711-prev">
        ◀ 前の週
      </button>
      <button id="v1711-current">
        今週
      </button>
      <button id="v1711-next"
        ${offset1711>=0?'disabled':''}>
        次の週 ▶
      </button>
    </div>

    <section class="card">
      <h3>🏆 1週間の記録</h3>

      <div class="stats">
        <div class="stat">
          ミッション達成
          <strong>${w.completed}/35</strong>
        </div>
        <div class="stat">
          練習記録のある日
          <strong>${w.practicedDays}日</strong>
        </div>
        <div class="stat">
          休養設定日
          <strong>${w.restDays}日</strong>
        </div>
        <div class="stat">
          練習履歴XP
          <strong>${w.xp}</strong>
        </div>
      </div>

      <p class="muted">
        XPは練習履歴に保存された値の合計です。
        累計XPの増加量とは異なる場合があります。
      </p>
    </section>

    <section class="card">
      <h3>📅 毎日の達成状況</h3>

      ${w.days.map(day=>{
        const parsed=parseDate1711(day.date);
        const dayName=parsed
          ?DAY_NAMES[parsed.getDay()]:'';

        return `
          <div class="day">
            <div class="row">
              <strong>
                ${esc1711(day.date.slice(5))}
                (${dayName})
              </strong>

              <strong>
                ${day.count}/5
              </strong>
            </div>

            <div class="bar">
              <div class="fill"
                style="width:${day.percent}%">
              </div>
            </div>

            <div class="muted">
              ${
                day.rest
                ?'🌙 休養設定あり'
                :day.practice
                  ?'⚾ 練習記録あり'
                  :'記録を確認'
              }
            </div>
          </div>
        `;
      }).join('')}
    </section>

    <section class="card">
      <h3>📈 先週との比較</h3>

      <p>
        先週：${previous.completed}/35
      </p>

      <p>
        今週：${w.completed}/35
      </p>

      <p>
        変化：
        <strong>
          ${change>0?'+':''}${change}項目
        </strong>
      </p>

      <p class="muted">
        今週が途中の場合は、7日間が終了した
        先週と単純比較しているため、
        数値が低くなることがあります。
      </p>
    </section>

    <section class="card">
      <h3>🌟 今週の監督コメント</h3>

      <p>${message1711(w)}</p>

      ${
        w.restDays>0
        ?'<p>💚 休養日も記録できているね。身体を守る判断も大切！</p>'
        :''
      }

      <p class="muted">
        達成率は記録習慣の指標です。
        野球の実力や健康状態を判定するものではありません。
      </p>
    </section>

    <section class="card">
      <h3>✏️ 週間振り返り</h3>

      <p>
        今週できたこと、課題、
        来週意識したいことを書こう。
      </p>

      <textarea id="v1711-note"
        placeholder="例：守備練習を頑張った。来週は送球の正確さを意識する。">${esc1711(savedNote)}</textarea>

      <button id="v1711-save">
        💾 振り返りを保存
      </button>
    </section>

    <section class="card">
      <h3>🔒 記録の取り扱い</h3>

      <p class="muted">
        このレポートは既存の練習・生活記録と
        デイリーミッションを読み取ります。
        週間振り返りだけを別の保存領域に記録します。
        XPや能力値は変更しません。
      </p>
    </section>
  `;

  app.querySelector('#v1711-close')
    .addEventListener('click',window.v1711Close);

  app.querySelector('#v1711-prev')
    .addEventListener('click',()=>{
      offset1711--;
      render1711();
    });

  app.querySelector('#v1711-current')
    .addEventListener('click',()=>{
      offset1711=0;
      render1711();
    });

  app.querySelector('#v1711-next')
    .addEventListener('click',()=>{
      if(offset1711<0){
        offset1711++;
        render1711();
      }
    });

  app.querySelector('#v1711-save')
    .addEventListener('click',()=>{
      const note=app.querySelector(
        '#v1711-note'
      ).value.trim();

      const all=read1711(NOTE_KEY);
      all[w.startKey]=note;

      try{
        localStorage.setItem(
          NOTE_KEY,
          JSON.stringify(all)
        );

        alert('週間振り返りを保存しました。');
      }catch(e){
        alert('保存に失敗しました。');
      }
    });
}

window.v1711Open=function(){
  offset1711=0;
  render1711();

  document.getElementById(
    'v1711-overlay'
  ).classList.add('open');
};

window.v1711Close=function(){
  document.getElementById(
    'v1711-overlay'
  ).classList.remove('open');
};

document.getElementById(
  'v1711-open'
).addEventListener(
  'click',
  window.v1711Open
);

})();
</script>

<!-- ===== 第17弾⑪ 終了 ===== -->
